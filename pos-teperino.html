const firebaseConfig = {
  apiKey: "AIzaSyBSE993oDGNCU7U1Ni7cAUhBDjog0BBZxE",
  authDomain: "cassa-teperino.firebaseapp.com",
  databaseURL: "https://cassa-teperino-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "cassa-teperino",
  storageBucket: "cassa-teperino.firebasestorage.app",
  messagingSenderId: "331086703077",
  appId: "1:331086703077:web:9375d4c91e3bc97482270c"
};

(async()=>{
  try{
    const {initializeApp}=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    const {getDatabase,ref,onValue,set,get}=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js');
    const fbApp=initializeApp(firebaseConfig);
    const db=getDatabase(fbApp);

    window.fbSet=async(key,val)=>{
      try{await set(ref(db,'pos/'+key),val);}catch(e){console.warn('fbSet:',e);}
    };
    window.fbGet=async(key)=>{
      const snap=await get(ref(db,'pos/'+key));
      return snap.exists()?snap.val():null;
    };
    const origSet=LS.set.bind(LS);
    LS.set=(k,v)=>{
      origSet(k,v);
      const keyMap={'pos-tavoli':'t','pos-asporto':'asp','pos-richieste-conto':'richieste-conto'};
      const fbKey=keyMap[k]||k.replace('pos-','');
      window.fbSet(fbKey,v);
    };

    // Leggi impostazioni dalla cassa
    // Ascolta il menu master da pos-cassa: si aggiorna in automatico su tutti i telefoni
    onValue(ref(db,'pos/m'),(snap)=>{
      if(snap.exists()){
        const val=snap.val();
        const nuovoMenu=Array.isArray(val)?val.filter(Boolean):Object.values(val);
        if(nuovoMenu && nuovoMenu.length){
          menu=nuovoMenu;
          localStorage.setItem('pos-menu',JSON.stringify(menu));
          // se il cameriere ha la griglia prodotti aperta, la ricostruisce con il menu aggiornato
          if(currentTavolo!==null && document.getElementById('login-overlay')){
            try{ entraTavolo(currentTavolo); }catch(e){}
          }
        }
      }
    });

    onValue(ref(db,'pos/s'),(snap)=>{
      if(snap.exists()){
        const cassaS=snap.val();
        if(cassaS.prezzoCoperto!==undefined) settings.prezzoCoperto=cassaS.prezzoCoperto;
        if(cassaS.zone) settings.zone=Array.isArray(cassaS.zone)?cassaS.zone:Object.values(cassaS.zone);
        if(cassaS.aggiunte) settings.aggiunte=Array.isArray(cassaS.aggiunte)?cassaS.aggiunte:Object.values(cassaS.aggiunte);
      }
    });

    // Leggi camerieri dal percorso dedicato
    onValue(ref(db,'pos/camerieri'),(snap)=>{
      if(snap.exists()){
        const val=snap.val();
        settings.camerieri=Array.isArray(val)?val:Object.values(val);
        localStorage.setItem('pos-camerieri',JSON.stringify(settings.camerieri));
      }
    });

    // Ascolta i tavoli da Firebase
    let _tavoliInit=false;
    onValue(ref(db,'pos/t'),(snap)=>{
      if(!_tavoliInit){
        // Prima connessione: carica tutti i tavoli occupati
        _tavoliInit=true;
        if(snap.exists()){
          const fbT=snap.val();
          const ora=Date.now();
          const cutoff=ora-(16*60*60*1000); // ultime 16 ore
          Object.entries(fbT).forEach(([k,t])=>{
            if(t&&t.stato==='occupato'){
              const ultimoTs=Math.max(...(t.giri||[]).map(g=>g.ts||0));
              if(ultimoTs>cutoff) tavoli[k]=t;
            }
          });
          localStorage.setItem('pos-tavoli',JSON.stringify(tavoli));
        }
        return;
      }
      // Aggiornamenti successivi: aggiorna tavoli liberati E aggiunge nuovi
      if(!snap.exists()){
        tavoli={};
        localStorage.setItem('pos-tavoli',JSON.stringify(tavoli));
        if(activeZona) mostraSala(activeZona);
        return;
      }
      const fbT=snap.val();
      let changed=false;
      // rimuovi tavoli liberati
      Object.keys(tavoli).forEach(k=>{
        const fb=fbT[k];
        if(!fb||fb.stato==='libero'){
          delete tavoli[k];
          changed=true;
        }
      });
      // aggiungi nuovi tavoli occupati (aperti da altri camerieri)
      Object.entries(fbT).forEach(([k,t])=>{
        if(t&&t.stato==='occupato'&&!tavoli[k]){
          tavoli[k]=t;
          changed=true;
        }
      });
      if(changed){
        localStorage.setItem('pos-tavoli',JSON.stringify(tavoli));
        if(activeZona) mostraSala(activeZona);
      }
    });

    // Ascolta richieste conto
    onValue(ref(db,'pos/richieste-conto'),(snap)=>{
      if(snap.exists()){
        localStorage.setItem('pos-richieste-conto',JSON.stringify(snap.val()));
      }
    });

    console.log('✅ Firebase connesso');
    window._fbOk=true;

  }catch(e){
    console.warn('Firebase non disponibile:', e);
    window._fbError=e.message||String(e);
  }
})();
