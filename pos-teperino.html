<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teperino POS — Fuerteventura</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');

:root {
  --bg:       #0F0D0B;
  --surface:  #1A1713;
  --surface2: #242018;
  --border:   #332E26;
  --text:     #F0EAE0;
  --muted:    #9A9080;
  --accent:   #E8541C;
  --gold:     #F2B705;
  --green:    #5AA655;
  --red:      #C94040;
  --font-display: 'Bebas Neue', sans-serif;
  --font-body:    'Inter', sans-serif;
  --font-mono:    'JetBrains Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; }

/* ---------- LAYOUT ---------- */
#app { display: flex; flex-direction: column; min-height: 100vh; }
.screen { display: none; flex-direction: column; min-height: 100vh; }
.screen.active { display: flex; }

/* ---------- TOPBAR ---------- */
.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 20px; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--bg); z-index: 100;
}
.topbar-title { font-family: var(--font-display); font-size: 24px; color: var(--accent); flex: 1; letter-spacing: .03em; }
.btn-back { background: none; border: none; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 14px; font-family: var(--font-body); padding: 6px 10px; border-radius: 8px; }
.btn-back:hover { background: var(--surface2); }

/* ---------- HOME SCREEN ---------- */
.home-header { text-align: center; padding: 40px 20px 24px; }
.home-logo { font-family: var(--font-display); font-size: 52px; color: var(--accent); letter-spacing: .04em; line-height: 1; }
.home-sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
.home-sync { font-size: 11px; margin-top: 8px; }

.role-grid { display: grid; gap: 12px; padding: 0 20px 20px; max-width: 480px; width: 100%; margin: 0 auto; }
.role-btn {
  display: flex; align-items: center; gap: 16px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 18px 20px; cursor: pointer; text-align: left; transition: border-color .15s;
}
.role-btn:hover { border-color: var(--accent); }
.role-icon { width: 46px; height: 46px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
.role-label { font-family: var(--font-display); font-size: 22px; color: var(--text); letter-spacing: .02em; line-height: 1.1; }
.role-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* ---------- GRIGLIA TAVOLI ---------- */
.tavoli-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; padding: 16px; }
.tavolo-btn {
  aspect-ratio: 1; border-radius: 12px; border: 1px solid var(--border);
  background: var(--surface); display: flex; flex-direction: column;
  align-items: center; justify-content: center; cursor: pointer; transition: all .15s;
}
.tavolo-btn.occupato { border-color: var(--accent); background: #E8541C18; }
.tavolo-btn.occupato:hover { background: #E8541C28; }
.tavolo-btn:not(.occupato):hover { border-color: var(--border); background: var(--surface2); }
.tavolo-num { font-family: var(--font-display); font-size: 28px; line-height: 1; }
.tavolo-tot { font-size: 10px; color: var(--gold); font-weight: 600; margin-top: 2px; }

/* ---------- DETTAGLIO TAVOLO ---------- */
.content-pad { padding: 16px; flex: 1; overflow-y: auto; padding-bottom: 90px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
.card-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
.section-title { font-family: var(--font-display); font-size: 20px; color: var(--accent); margin: 16px 0 8px; letter-spacing: .02em; }

/* stepper */
.stepper { display: flex; align-items: center; gap: 10px; }
.step-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; line-height: 1; }
.step-btn.plus { background: var(--accent); border-color: var(--accent); color: #111; }
.step-btn:hover:not(.plus) { border-color: var(--muted); }
.step-val { min-width: 28px; text-align: center; font-size: 16px; font-weight: 600; }

/* prodotto riga */
.prod-row { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; }
.prod-top { display: flex; justify-content: space-between; align-items: center; }
.prod-name { font-size: 14px; font-weight: 500; }
.prod-price { font-size: 13px; color: var(--muted); }
.prod-note { width: 100%; margin-top: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; color: var(--text); font-family: var(--font-body); font-size: 12px; }
.prod-note::placeholder { color: var(--border); }

/* riepilogo comanda */
.riepilogo-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }
.riepilogo-row.muted { color: var(--muted); }
.riepilogo-total { display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; padding-top: 10px; margin-top: 8px; border-top: 1px solid var(--border); }
.riepilogo-total span:last-child { color: var(--gold); }

/* bottom bar */
.bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 12px 16px; z-index: 100; }

/* ---------- BUTTONS ---------- */
.btn { border-radius: 10px; padding: 12px 16px; font-family: var(--font-body); font-size: 14px; font-weight: 600; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; transition: opacity .1s; }
.btn:disabled { opacity: .5; cursor: default; }
.btn-primary { background: var(--accent); color: #111; }
.btn-primary:hover:not(:disabled) { filter: brightness(1.1); }
.btn-secondary { background: var(--surface2); border: 1px solid var(--border); color: var(--text); }
.btn-secondary:hover { border-color: var(--muted); }
.btn-success { background: var(--green); color: #111; }
.btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* ---------- INPUT / SELECT ---------- */
.form-field { margin-bottom: 14px; }
.form-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; display: block; }
.form-input { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--text); font-family: var(--font-body); font-size: 14px; }
.form-input:focus { outline: none; border-color: var(--accent); }
.form-select { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--text); font-family: var(--font-body); font-size: 14px; }

/* ---------- CASSA ---------- */
.cassa-row { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; margin-bottom: 8px; transition: border-color .15s; }
.cassa-row:hover { border-color: var(--accent); }
.cassa-row-info { font-size: 11px; color: var(--muted); margin-top: 2px; }
.cassa-tot { font-size: 17px; font-weight: 700; color: var(--gold); }

/* ---------- REPARTO / TICKET ---------- */
.ticket-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; padding: 16px; }
.ticket {
  background: #F5EFE6; color: #14110F; border-radius: 6px; padding: 14px;
  font-family: var(--font-mono); position: relative;
}
.ticket-header { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 6px; font-size: 14px; }
.ticket-divider { border: none; border-top: 1px dashed #14110F66; margin: 6px 0; }
.ticket-item { font-size: 13px; margin-bottom: 4px; font-weight: 700; }
.ticket-note { font-size: 11px; font-style: italic; margin-top: 1px; }
.ticket-actions { display: flex; gap: 6px; margin-top: 10px; }
.ticket-btn { flex: 1; padding: 8px; border-radius: 6px; border: none; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; }
.ticket-btn.stampa { background: #14110F; color: #F5EFE6; }
.ticket-btn.pronto { background: #5AA655; color: #14110F; }

/* ---------- STATISTICHE ---------- */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; padding: 16px 16px 4px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.stat-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.stat-value { font-family: var(--font-display); font-size: 24px; letter-spacing: .02em; }

.bar-chart { padding: 0 16px 16px; }
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.bar-name { font-size: 12px; width: 130px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-track { flex: 1; background: var(--surface2); border-radius: 4px; height: 18px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; background: var(--accent); transition: width .4s; }
.bar-val { font-size: 11px; color: var(--muted); width: 60px; text-align: right; flex-shrink: 0; }

/* ---------- TABS ---------- */
.tabs { display: flex; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.tab { padding: 6px 14px; border-radius: 8px; font-size: 13px; border: 1px solid var(--border); cursor: pointer; background: var(--surface); color: var(--text); font-family: var(--font-body); }
.tab.active { background: var(--accent); color: #111; border-color: var(--accent); }

/* ---------- SETTINGS MENU ITEMS ---------- */
.menu-item-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.menu-item-row .form-input { flex: 2; margin: 0; }
.menu-item-row .form-input.price { flex: 1; }
.icon-btn { width: 36px; height: 36px; flex-shrink: 0; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.icon-btn.danger { border-color: var(--red); color: var(--red); }

/* ---------- ERRORS / STATUS ---------- */
.error-bar { background: #C9404022; border: 1px solid var(--red); color: var(--red); border-radius: 8px; padding: 8px 12px; font-size: 12px; text-align: center; margin-bottom: 8px; }
.success-bar { background: #5AA65522; border: 1px solid var(--green); color: var(--green); border-radius: 8px; padding: 8px 12px; font-size: 12px; text-align: center; margin-bottom: 8px; }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
.status-dot.green { background: var(--green); }
.status-dot.red { background: var(--red); }

/* ---------- CONFIRM OVERLAY ---------- */
.overlay { position: fixed; inset: 0; background: #000000CC; display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
.overlay-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; width: 100%; max-width: 360px; }
.overlay-title { font-family: var(--font-display); font-size: 22px; margin-bottom: 10px; }
.overlay-text { font-size: 14px; color: var(--muted); margin-bottom: 20px; line-height: 1.5; }

/* ---------- PRINT ---------- */
@media print {
  body * { display: none !important; }
  #print-area { display: block !important; }
  @page { size: 80mm auto; margin: 4mm; }
  #print-area { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #000; }
  #print-area .p-center { text-align: center; }
  #print-area .p-bold { font-weight: bold; }
  #print-area .p-big { font-size: 15px; font-weight: bold; }
  #print-area .p-divider { border-top: 1px dashed #000; margin: 5px 0; }
  #print-area .p-row { display: flex !important; justify-content: space-between; }
  #print-area .p-small { font-size: 11px; }
}
#print-area { display: none; }

.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent);background:transparent;transition:background .1s;}
.pin-dot.filled{background:var(--accent);}
@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(242,183,5,.5)} 50%{box-shadow:0 0 0 6px rgba(242,183,5,0)} }
.fresh { animation: pulse 1.8s ease-in-out 3; }
</style>
</head>

<div id="app">
<!-- LOGIN OVERLAY -->
<div id="login-overlay" style="position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;">
  <div style="font-size:22px;font-weight:700;color:var(--accent);margin-bottom:8px;">🍕 Teperino</div>
  <div style="font-size:14px;color:var(--muted);margin-bottom:24px;">Sistema comande — Fuerteventura</div>

  <!-- Login cameriere -->
  <div style="font-size:13px;color:var(--muted);margin-bottom:8px;">Cameriere — inserisci il tuo codice</div>
  <input id="login-code" type="tel" maxlength="4" placeholder="0000"
    style="font-size:36px;text-align:center;width:160px;padding:12px;border-radius:12px;
           border:2px solid var(--border);background:var(--surface2);color:var(--text);
           margin-bottom:12px;">
  <button onclick="doLogin()"
    style="width:200px;padding:14px;border-radius:12px;background:var(--accent);
           border:none;color:#111;font-size:18px;font-weight:700;cursor:pointer;">
    ✓ Entra

  if(vinoIds.includes(p.id)     && !p.cat) { p.cat = 'Vino';      migrated = true; }
});

function tabellaLabel(key){
  if(!key) return '—';
  const parts=key.split('_');
  const zId=parts.slice(0,-1).join('_');
  const num=parts[parts.length-1];
  const z=(settings.zone||[]).find(x=>x.id===zId);
  return z?z.nome+' T.'+num:'Tavolo '+key;
}

function tabellaInfo(key){
  if(!key) return {zona:null,num:'?',nome:'—'};
  const parts=key.split('_');
  const zId=parts.slice(0,-1).join('_');
  const num=parts[parts.length-1];
  const zona=(settings.zone||[]).find(x=>x.id===zId)||null;
  const nome=zona?zona.nome.replace(/[^\w\s]/g,'').trim()+' / T'+num:'T'+num;
  return {zona,num,nome};
}

// ─────────────────────────────────────────────
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function eur(n) { return Number(n).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €'; }
function nowTime() { return new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}); }
function todayStr() { return new Date().toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'}); }

function tavoloImporto(t) {
  if(!t) return 0;
  return (t.giri||[]).reduce((s,g)=>s+g.voci.reduce((ss,v)=>ss+(v.prezzoUnitario||v.prezzo)*v.qty,0),0);
}
function tavoloCoperti(t) { if(!t) return 0; return (t.coperti||0) * (settings.prezzoCoperto||0); }
function tavoloTotale(t)  { if(!t) return 0; return tavoloImporto(t) + tavoloCoperti(t); }

function showScreen(id) {
  if (repartoInterval) { clearInterval(repartoInterval); repartoInterval = null; }
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');

  if (id === 'home'){
    mostraLogin();
    camName='';
  }
  if (id === 'cameriere') renderCameriereGrid();
  if (id === 'cassa')     renderCassa();
  if (id === 'statistiche') renderStatistiche();
  if (id === 'impostazioni') renderImpostazioni();
  if (id === 'home')      renderRepartoButtons();
}

      <div>
        <div class="role-label">${r}</div>
        <div class="role-sub">Vista comande reparto</div>
      </div>
    </button>
  `).join('');
}

let nameTimeout = null;
function salvaName(v) {
  camName = v;
  LS.set('pos-cam-name', v);
  clearTimeout(nameTimeout);
}

function setZonaCam(id){activeZona=id;renderCameriereGrid();}

function renderCameriereGrid() {
  try{
    const defaultZone=[
      {id:'terrazza',nome:'Terrazza',num:36},
      {id:'sala1',nome:'Sala 1',num:12},
      {id:'sala2',nome:'Sala 2',num:8},
      {id:'sofa',nome:'Sofà 🛋️',num:3}
    ];
    const zone=(settings.zone&&settings.zone.length)?settings.zone:defaultZone;
    if(!activeZona||!zone.find(z=>z.id===activeZona)) activeZona=zone[0].id;
    const z=zone.find(x=>x.id===activeZona)||zone[0];
    const g=document.getElementById('cam-tavoli-grid');
    if(!g) return;

    let html='<div style="display:flex;gap:5px;margin-bottom:10px;">';
    zone.forEach(zo=>html+=`<button onclick="setZonaCam('${zo.id}')" style="
      flex:1;padding:8px 4px;border:2px solid ${activeZona===zo.id?'var(--accent)':'var(--border)'};
      border-radius:8px;background:${activeZona===zo.id?'var(--accent)':'var(--surface2)'};
      color:${activeZona===zo.id?'#111':'var(--muted)'};font-size:14px;font-weight:700;cursor:pointer;">${zo.nome}</button>`);
    html+='</div>';
    html+=`<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;">`;
    for(let i=1;i<=(z.num||0);i++){
      const k=z.id+'_'+i;
      const t=tavoli[k];
      const occ=t&&t.stato==='occupato';
      html+=`<button onclick="openTavolo('${k}','cameriere')" style="
        aspect-ratio:1;border-radius:12px;
        border:${occ?'3px solid var(--accent)':'1px solid var(--border)'};
        background:${occ?'var(--accent)':'var(--surface)'};
        display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;">
        <div style="font-size:20px;font-weight:700;color:${occ?'#111':'var(--text)'};">${i}</div>
        ${occ?`<div style="font-size:8px;color:#111;font-weight:700">${eur(tavoloTotale(t))}</div>`:''}
      </button>`;
    }
    html+='</div>';
    g.innerHTML=html;
  }catch(e){
    const g=document.getElementById('cam-tavoli-grid');
    if(g) g.innerHTML=`<div style="color:red;padding:20px">Errore: ${e.message}</div>`;
  }
}

function getItemsForTab(tab) {
  if(tab === 'Riepilogo') return [];
  if(tab === '📋 Tutte')    return menu.filter(m => m.reparto==='Pizzeria');
  if(tab === '🍕 Pizze')    return menu.filter(m => m.reparto==='Pizzeria' && !m.cat);
  if(tab === '👑 Reali')    return menu.filter(m => m.cat==='Reali');
  if(tab === '📜 Storiche') return menu.filter(m => m.cat==='Storiche');
  if(tab === '👵 Suocere')  return menu.filter(m => m.cat==='Suocere');
  if(tab === '⭐ Speciali') return menu.filter(m => m.cat==='Speciali');
  if(tab === '🥟 Fritte')   return menu.filter(m => m.cat==='Fritte');
  if(tab === '🥖 Panuozzi') return menu.filter(m => m.cat==='Panuozzi');
  if(tab === '🍰 Dolci')    return menu.filter(m => m.cat==='Dolci');
  if(tab === '🍷 Vino')     return menu.filter(m => m.cat==='Vino');
  if(tab === '🍟 Antipasti/Fritti')   return menu.filter(m => m.reparto==='Cucina' && m.cat!=='Dolci');
  if(tab === '🍺 Birre')      return menu.filter(m => m.reparto==='Bar' && m.cat==='Birre');
  if(tab === '🥤 Bibite')     return menu.filter(m => m.reparto==='Bar' && m.cat==='Bibite');
  if(tab === '☕ Caffetteria') return menu.filter(m => m.reparto==='Bar' && m.cat==='Caffetteria');
  if(tab === '🥃 Liquori')    return menu.filter(m => m.reparto==='Bar' && m.cat==='Liquori');
  if(tab === '🍹 Aperitivo')  return menu.filter(m => m.reparto==='Bar' && m.cat==='Aperitivo');
  if(tab === '🍺 Bar')        return menu.filter(m => m.reparto==='Bar' && m.cat!=='Vino');
  return menu.filter(m => m.reparto === tab && !m.cat);
}

function renderMenuTabs() {
  const bar = document.getElementById('menu-tab-bar');
  if (!bar) return;
  const tabs = ['Riepilogo', '🍺 Bar', '🍷 Vino', '📋 Tutte', '🍕 Pizze', '👵 Suocere', '👑 Reali', '📜 Storiche', '🥟 Fritte', '🥖 Panuozzi', '🍟 Antipasti/Fritti', '🍰 Dolci'];
  bar.innerHTML = tabs.map(t => `
    <button onclick="setMenuTab('${t}')" style="
      white-space:nowrap; padding:6px 14px; border-radius:8px; font-size:12px;
      border:1px solid ${activeMenuTab===t?'var(--accent)':'var(--border)'};
      background:${activeMenuTab===t?'var(--accent)':'var(--surface)'};
      color:${activeMenuTab===t?'#111':'var(--text)'};
      font-family:var(--font-body); cursor:pointer; flex-shrink:0;
    ">${t}</button>
  `).join('');
}

function setMenuTab(tab) {
  activeMenuTab = tab;
  renderMenuTabs();
  renderTavoloContent();
}

function openTavolo(num, from) {
  currentTavolo = num;
  cart = {};
  activeMenuTab = settings.reparti[0]; // apre sempre sul primo reparto (Pizzeria)

  document.getElementById('tavolo-title').textContent = tabellaLabel(num);
  document.getElementById('tavolo-back-btn').onclick = () => {
    if (from === 'cassa') { showScreen('cassa'); renderCassa(); }
    else { showScreen('cameriere'); renderCameriereGrid(); }
  };

  renderMenuTabs();
  renderTavoloContent();
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-tavolo').classList.add('active');
}

function cartPrezzoVoce(key) {
  const v = cart[key]; if(!v||!v.qty) return 0;
  const prodId = v.prodottoId||key;
  const p = menu.find(m=>m.id===prodId); if(!p) return 0;
  const aggExtra = (v.aggiunte||[]).reduce((s,aid)=>{
    const a=(settings.aggiunte||[]).find(x=>x.id===aid); return s+(a?a.prezzo:0);
  },0);
  return (p.prezzo + aggExtra) * v.qty;
}

function isPizza(p) { return p.reparto==='Pizzeria'; }

function renderTavoloContent() {
  const num = currentTavolo;
  const t = tavoli[num];
  const repartiMenu = settings.reparti.map(r => ({reparto:r, items:menu.filter(m=>m.reparto===r)}));
  let html = '';

  // COPERTI
  html += `<div class="card">
    <div class="card-label">Coperti</div>
    <div class="stepper">
      <button class="step-btn" onclick="cambCoperti(-1)">−</button>
      <div class="step-val" id="cop-val">${t.coperti||0}</div>
      <button class="step-btn plus" onclick="cambCoperti(1)">+</button>
    </div>
  </div>`;

  // COMANDE INVIATE
  const totImporto = tavoloImporto(t);
  const totCoperti = tavoloCoperti(t);
  const totale = totImporto + totCoperti;

  if ((t.giri||[]).length > 0 || (t.coperti||0) > 0) {
    html += `<div class="card-label" style="padding:0 0 6px;">Comande inviate</div><div class="card">`;
    (t.giri||[]).forEach(g => {
      html += `<div style="font-size:11px;color:var(--muted);margin-bottom:3px;">${g.orario}</div>`;
      g.voci.forEach(v => {
        const aggLabel = (v.aggiunte||[]).length ? ` <span style="color:var(--green);font-size:11px;">+ ${v.aggiunte.map(a=>a.nome).join(', ')}</span>` : '';
        html += `<div class="riepilogo-row">${v.qty}× ${v.nome}${aggLabel}${v.note?` <span style="color:var(--muted);font-size:12px;">(${v.note})</span>`:''} ${v.pronto?'<span style="color:var(--green);">✓</span>':''}<span>${eur(v.prezzoUnitario*v.qty)}</span></div>`;
      });
    });
    if ((t.coperti||0) > 0) {
      html += `<div class="riepilogo-row muted">Coperti ×${t.coperti}<span>${eur(totCoperti)}</span></div>`;
    }
    html += `<div class="riepilogo-total"><span>Totale</span><span>${eur(totale)}</span></div>`;
    html += `</div>`;
    html += `<button class="btn btn-secondary" style="margin-bottom:12px;" onclick="stampaConto('${num}')">🖨️ Stampa conto</button>`;
  }

  // MENU — mostra solo il tab attivo
  if (activeMenuTab === 'Riepilogo') {
    // mostra coperti + riepilogo già visualizzato sopra, nient'altro
  } else {
    const repItems = getItemsForTab(activeMenuTab);
    repItems.forEach(p => {
      const hasPizza = isPizza(p);
      // tutte le entrate cart per questo prodotto
      const entries = Object.entries(cart).filter(([k,v])=>(v.prodottoId||k)===p.id && v.qty>0);
      const totalQty = entries.reduce((s,[,v])=>s+v.qty,0);
      // usa prima entrata semplice o crea placeholder
      const mainKey = entries.find(([,v])=>(v.aggiunte||[]).length===0)?.[0] || entries[0]?.[0] || p.id;
      const mainC = cart[mainKey] || {qty:0, note:'', aggiunte:[]};

      html += `<div class="prod-row" id="prod-${p.id}">
        <div class="prod-top">
          <div>
            <div class="prod-name">${p.nome}</div>
            <div class="prod-price">${eur(p.prezzo)}</div>
          </div>
          <div class="stepper">
            <button class="step-btn" onclick="cambCart('${p.id}',-1)">−</button>
            <div class="step-val" id="qty-${p.id}">${totalQty}</div>
            <button class="step-btn plus" onclick="cambCart('${p.id}',1)">+</button>
          </div>
        </div>`;

      // mostra ogni entrata separata con le sue aggiunte
      if(totalQty > 0 && hasPizza){
        entries.forEach(([k,v])=>{
          const aggExtra=(v.aggiunte||[]).reduce((s,aid)=>{const a=(settings.aggiunte||[]).find(x=>x.id===aid);return s+(a?a.prezzo:0);},0);
          html+=`<div style="background:var(--surface2);border-radius:8px;padding:4px 8px;margin-top:2px;">
            <div style="font-size:10px;color:var(--muted);margin-bottom:3px">× ${v.qty} — ${eur(p.prezzo+aggExtra)} cad.</div>
            <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px;">
              ${(settings.aggiunte||[]).map(a=>{
                const sel=(v.aggiunte||[]).includes(a.id);
                return `<button onclick="toggleAggKey('${k}','${a.id}')" style="padding:3px 7px;border-radius:6px;border:1px solid ${sel?'var(--green)':'var(--border)'};background:${sel?'#5AA65522':'var(--surface)'};color:${sel?'var(--green)':'var(--muted)'};font-size:11px;cursor:pointer;">${a.nome} +${eur(a.prezzo)}</button>`;
              }).join('')}
            </div>
            <input class="prod-note" placeholder="Note (es. senza cipolla)" value="${v.note||''}" oninput="cart['${k}']={...cart['${k}'],note:this.value}">
          </div>`;
        });
      } else if(totalQty > 0 && !hasPizza){
        html+=`<div id="note-wrap-${p.id}" style="margin-top:4px">
          <input class="prod-note" placeholder="Note" id="note-${p.id}" value="${mainC.note||''}" oninput="cart['${mainKey}']={...cart['${mainKey}'],note:this.value}">
        </div>`;
      }

      html += `</div>`;
    });
  }

  document.getElementById('tavolo-content').innerHTML = html;
  renderBottomBar();
  // ripristina ricerca aggiunte dopo ogni re-render
  Object.entries(aggSearchState).forEach(([pid,q])=>{
    if(!q) return;
    const inp=document.getElementById('agg-search-'+pid);
    if(inp){inp.value=q;filtraAgg(pid,q);}
  });
}

function filtraAgg(prodId, query){
  aggSearchState[prodId] = query;
  const list=document.getElementById('agg-list-'+prodId);
  if(!list) return;
  const q=query.toLowerCase().trim();
  list.querySelectorAll('button').forEach(btn=>{
    btn.style.display=(!q||btn.textContent.toLowerCase().includes(q))?'':'none';
  });
}

function filtraAgg2(prodId, query){
  const list=document.getElementById('agg-list2-'+prodId);
  if(!list) return;
  const q=query.toLowerCase().trim();
  list.querySelectorAll('button').forEach(btn=>{
    btn.style.display=(!q||btn.textContent.toLowerCase().includes(q))?'':'none';
  });
}

function cambCoperti(delta) {
  const t = tavoli[currentTavolo];
  t.coperti = Math.max(0, (t.coperti||0) + delta);
  if (t.coperti > 0 && t.stato === 'libero') { t.stato = 'occupato'; t.apertoAlle = nowTime(); }
  LS.set('pos-tavoli', tavoli);
  renderTavoloContent();
}

function cambCart(id, delta) {
  const p = menu.find(m=>m.id===id);
  if(delta > 0 && p && isPizza(p)) {
    // Per pizze: se esiste già un'entrata senza aggiunte e senza note, incrementa quella
    // Altrimenti crea nuova entrata separata
    const emptyKey = Object.keys(cart).find(k=>{
      const v=cart[k];
      return (v.prodottoId||k)===id && (v.aggiunte||[]).length===0 && !v.note && v.qty>0;
    });
    if(emptyKey){
      cart[emptyKey].qty++;
    } else if(cart[id] && (cart[id].aggiunte||[]).length===0 && !cart[id].note){
      cart[id].qty = (cart[id].qty||0)+1;
    } else {
      // crea entrata separata con chiave unica
      const k = id+'_'+Date.now();
      cart[k] = {qty:1, note:'', aggiunte:[], prodottoId:id};
    }
  } else if(delta < 0 && p && isPizza(p)) {
    // rimuovi l'ultima entrata per questo prodotto
    const keys = Object.keys(cart).filter(k=>(cart[k].prodottoId||k)===id && cart[k].qty>0);
    if(keys.length > 0){
      const lastKey = keys[keys.length-1];
      cart[lastKey].qty--;
      if(cart[lastKey].qty===0) delete cart[lastKey];
    }
  } else {
    const c = cart[id] || {qty:0, note:'', aggiunte:[], prodottoId:id};
    c.qty = Math.max(0, c.qty + delta);
    if(c.qty === 0) { delete cart[id]; } else { cart[id] = c; }
  }
  renderTavoloContent();
}

function toggleAggKey(cartKey, aggId) {
  const c = cart[cartKey]; if(!c) return;
  c.aggiunte = c.aggiunte || [];
  const idx = c.aggiunte.indexOf(aggId);
  if(idx === -1) c.aggiunte.push(aggId); else c.aggiunte.splice(idx,1);
  renderTavoloContent();
}

function toggleAgg(prodId, aggId) {
  const c = cart[prodId]; if(!c) return;
  c.aggiunte = c.aggiunte || [];
  const idx = c.aggiunte.indexOf(aggId);
  const sel = idx === -1;
  if (sel) c.aggiunte.push(aggId); else c.aggiunte.splice(idx,1);
  // aggiorna solo il chip cliccato — nessun re-render completo
  const list = document.getElementById('agg-list-'+prodId);
  if(list) list.querySelectorAll('button').forEach(btn=>{
    if(btn.getAttribute('onclick')?.includes("'"+aggId+"'")){
      btn.style.borderColor = sel?'var(--green)':'var(--border)';
      btn.style.background  = sel?'#5AA65522':'var(--surface2)';
      btn.style.color       = sel?'var(--green)':'var(--muted)';
    }
  });
  renderBottomBar();
}

function renderBottomBar() {
  const items = Object.entries(cart).filter(([,v])=>v.qty>0);
  const tot   = items.reduce((s,[id])=>s+cartPrezzoVoce(id),0);
  const bar   = document.getElementById('tavolo-bottom-bar');

  const t = tavoli[currentTavolo];
  const pizzeInAttesa = (t?.giri||[]).some(g=>g.voci.some(v=>v.aspetta&&!v.pronto));
  const haComande = (t?.giri||[]).length > 0;

  let html='';
  if(pizzeInAttesa){
    html+=`<button onclick="cameriereIniziaPizze('${currentTavolo}')" style="
      width:100%;padding:13px;border-radius:10px;border:2px solid #F2B705;
      background:#F2B70522;color:#F2B705;font-family:'Bebas Neue',sans-serif;
      font-size:19px;letter-spacing:.04em;cursor:pointer;margin-bottom:8px;">
      🍕 Avvisa pizzaiolo — Inizia le pizze
    </button>`;
  }
  if(haComande){
    html+=`<button onclick="richiedeIlConto('${currentTavolo}')" style="
      width:100%;padding:11px;border-radius:10px;border:2px solid var(--accent);
      background:var(--accent)22;color:var(--accent);font-family:'Bebas Neue',sans-serif;
      font-size:18px;letter-spacing:.04em;cursor:pointer;margin-bottom:8px;">
      🧾 Chiede il conto
    </button>`;
  }
  if(items.length > 0){
    html+=`<div id="send-error" class="error-bar" style="display:none;">Errore — riprova</div>
    <button class="btn btn-primary" id="btn-invia" onclick="inviaComanda()">
      Invia comanda · ${items.reduce((s,[,v])=>s+v.qty,0)} pz · ${eur(tot)}
    </button>`;
  }
  bar.innerHTML = html;
}

async function inviaComanda(aspettaAntipasto) {
  const items = Object.entries(cart).filter(([,v])=>v.qty>0);
  if (!items.length) return;

  if(aspettaAntipasto === undefined){
    const haPizze   = items.some(([k,v])=>{ const prodId=v.prodottoId||k; const p=menu.find(m=>m.id===prodId); return p&&p.reparto==='Pizzeria';});
    const haAntipas = items.some(([k,v])=>{ const prodId=v.prodottoId||k; const p=menu.find(m=>m.id===prodId); return p&&p.reparto==='Cucina';});
    if(haPizze && haAntipas){
      const ov=document.getElementById('overlay');
      document.getElementById('overlay-title').textContent='Ordine misto';
      document.getElementById('overlay-text').innerHTML=`
        <div style="font-size:13px;color:var(--muted);margin-bottom:16px">Ci sono sia antipasti che pizze.<br>Vuoi che il pizzaiolo aspetti?</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <button onclick="closeOverlay();inviaComanda(true)" style="background:#F2B70522;border:2px solid var(--gold);color:var(--gold);border-radius:12px;padding:16px 8px;font-size:13px;cursor:pointer;font-family:var(--font-body);font-weight:700">🕐 Pizze dopo<br>gli antipasti</button>
          <button onclick="closeOverlay();inviaComanda(false)" style="background:#5AA65522;border:2px solid var(--green);color:var(--green);border-radius:12px;padding:16px 8px;font-size:13px;cursor:pointer;font-family:var(--font-body);font-weight:700">🍕 Manda tutto<br>subito</button>
        </div>`;
      document.getElementById('overlay-confirm-btn').style.display='none';
      ov.style.display='flex';
      return;
    }
    aspettaAntipasto = false;
  }

  const btn = document.getElementById('btn-invia');
  if(btn){btn.disabled = true; btn.textContent = 'Invio…';}

  const voci = items.map(([k,v]) => {
    const prodId = v.prodottoId||k;
    const p = menu.find(m=>m.id===prodId);
    if(!p) return null;
    const aggSelezionate = (v.aggiunte||[]).map(aid=>{
      const a=(settings.aggiunte||[]).find(x=>x.id===aid);
      return a ? {id:a.id, nome:a.nome, prezzo:a.prezzo} : null;
    }).filter(Boolean);
    const prezzoExtra = aggSelezionate.reduce((s,a)=>s+a.prezzo,0);
    const prezzoUnitario = p.prezzo + prezzoExtra;
    const aspetta = aspettaAntipasto && p.reparto==='Pizzeria';
    return {
      vid:uid(), prodottoId:prodId, nome:p.nome,
      prezzo:p.prezzo, prezzoUnitario,
      aggiunte:aggSelezionate,
      reparto:p.reparto, qty:v.qty,
      note:v.note||'', pronto:false,
      aspetta: aspetta||false
    };
  }).filter(Boolean);
  const giro = {gid:uid(), orario:nowTime(), ts:Date.now(), voci};
  const t = tavoli[currentTavolo];
  t.stato = 'occupato';
  t.cameriere = camName || t.cameriere || '';
  t.apertoAlle = t.apertoAlle || nowTime();
  t.giri = [...(t.giri||[]), giro];
  LS.set('pos-tavoli', tavoli);
  cart = {};
  renderTavoloContent();
}

function renderCassa() {
  const occupati = Object.entries(tavoli).filter(([,t])=>t.stato==='occupato').sort(([a],[b])=>a.localeCompare(b));
  const el = document.getElementById('cassa-content');
  if (!occupati.length) { el.innerHTML = '<div style="color:var(--muted);text-align:center;margin-top:60px;">Nessun tavolo occupato</div>'; return; }
  el.innerHTML = occupati.map(([key, t]) => `
    <div class="cassa-row" onclick="openCassaTavolo('${key}')">
      <div>
        <div style="font-family:var(--font-display);font-size:20px;">${tabellaLabel(key)}</div>
        <div class="cassa-row-info">${t.cameriere?`Cam: ${t.cameriere} · `:''}${t.apertoAlle?`dalle ${t.apertoAlle}`:''}${(t.coperti||0)>0?` · ${t.coperti} cop.`:''}</div>
      </div>
      <div class="cassa-tot">${eur(tavoloTotale(t))}</div>
    </div>
  `).join('');
}

function openCassaTavolo(num) {
  currentTavolo = num;
  document.getElementById('cassa-tavolo-title').textContent = tabellaLabel(num);
  renderCassaTavoloDetail();
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-cassa-tavolo').classList.add('active');
}

function renderCassaTavoloDetail() {
  const num = currentTavolo;
  const t   = tavoli[num];
  const totImporto = tavoloImporto(t);
  const totCoperti = tavoloCoperti(t);
  const totale = totImporto + totCoperti;

  let html = `<div class="card">`;
  if (t.cameriere||t.apertoAlle) html += `<div style="font-size:12px;color:var(--muted);margin-bottom:10px;">${t.cameriere?`Cam: ${t.cameriere}`:''} ${t.apertoAlle?`· dalle ${t.apertoAlle}`:''} ${(t.coperti||0)>0?`· ${t.coperti} coperti`:''}</div>`;
  (t.giri||[]).forEach(g => {
    html += `<div style="font-size:11px;color:var(--muted);margin-bottom:3px;">${g.orario}</div>`;
    g.voci.forEach(v => {
      const aggLabel = (v.aggiunte||[]).length ? ` <span style="color:var(--green);font-size:11px;">+ ${v.aggiunte.map(a=>a.nome).join(', ')}</span>` : '';
      html += `<div class="riepilogo-row">${v.qty}× ${v.nome}${aggLabel}${v.note?` (${v.note})`:''}<span>${eur((v.prezzoUnitario||v.prezzo)*v.qty)}</span></div>`;
    });
  });
  if ((t.coperti||0)>0) html+=`<div class="riepilogo-row muted">Coperti ×${t.coperti}<span>${eur(totCoperti)}</span></div>`;
  html+=`<div class="riepilogo-total"><span>Totale</span><span>${eur(totale)}</span></div>`;
  html+=`</div>`;
  document.getElementById('cassa-tavolo-content').innerHTML = html;

  document.getElementById('cassa-tavolo-bottom').innerHTML = `
    <div class="btn-grid" style="margin-bottom:8px;">
      <button class="btn btn-secondary" onclick="stampaConto('${num}')">🖨️ Conto</button>
      <button class="btn btn-secondary" onclick="openTavolo('${num}','cassa')">➕ Aggiungi</button>
    </div>
    <button class="btn btn-success" onclick="showPagamento('${num}', ${totale})">Incassa e chiudi — ${eur(totale)}</button>
  `;
}

function showPagamento(num, totale) {
  document.getElementById('overlay-title').textContent = `Tavolo ${num} — ${eur(totale)}`;
  document.getElementById('overlay-text').innerHTML = `
    <div style="font-size:13px;color:var(--muted);margin-bottom:16px;">Come paga il cliente?</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <button onclick="chiudiTavolo('${num}',${totale},'cash',0)" style="
        background:#F2B70522;border:2px solid var(--gold);color:var(--gold);
        border-radius:12px;padding:20px 10px;font-size:22px;cursor:pointer;
        font-family:var(--font-display);letter-spacing:.03em;display:flex;
        flex-direction:column;align-items:center;gap:6px;">
        💵<span>CASH</span>
      </button>
      <button onclick="showMancia('${num}',${totale})" style="
        background:#5AA65522;border:2px solid var(--green);color:var(--green);
        border-radius:12px;padding:20px 10px;font-size:22px;cursor:pointer;
        font-family:var(--font-display);letter-spacing:.03em;display:flex;
        flex-direction:column;align-items:center;gap:6px;">
        💳<span>POS</span>
      </button>
    </div>
    <button onclick="closeOverlay()" style="margin-top:12px;width:100%;background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:8px;cursor:pointer;font-family:var(--font-body);font-size:13px;">Annulla</button>
  `;
  document.getElementById('overlay-confirm-btn').style.display = 'none';
  document.getElementById('overlay').style.display = 'flex';
}

function showMancia(num, totale) {
  document.getElementById('overlay-title').textContent = `Tavolo ${num} — POS`;
  document.getElementById('overlay-text').innerHTML = `
    <div style="font-size:13px;color:var(--muted);margin-bottom:4px;">Importo conto</div>
    <div style="font-size:20px;font-weight:700;color:var(--gold);margin-bottom:16px;">${eur(totale)}</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:6px;">Il cliente ha lasciato una mancia sul POS?</div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
      <span style="font-size:13px;color:var(--text);">€</span>
      <input type="number" id="mancia-input" step="0.50" min="0" placeholder="0,00"
        style="flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;
        padding:10px 12px;color:var(--text);font-size:16px;font-family:var(--font-body);">
    </div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:16px;">
      La mancia viene scorporata dall'incasso e conteggiata a parte per i camerieri.
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <button onclick="closeOverlay();showPagamento('${num}',${totale})" style="background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:10px;cursor:pointer;font-family:var(--font-body);font-size:13px;">← Indietro</button>
      <button onclick="confermaPOS('${num}',${totale})" style="background:var(--green);border:none;color:#111;border-radius:8px;padding:10px;cursor:pointer;font-family:var(--font-body);font-size:13px;font-weight:700;">✓ Chiudi tavolo</button>
    </div>
  `;
  document.getElementById('overlay-confirm-btn').style.display = 'none';
  document.getElementById('overlay').style.display = 'flex';
}

function confermaPOS(num, totale) {
  const mancia = parseFloat(document.getElementById('mancia-input')?.value) || 0;
  chiudiTavolo(num, totale, 'pos', mancia);
}

function chiudiTavolo(num, totale, pagamento, mancia) {
  const t = tavoli[num];
  const manciaVal = mancia || 0;
  storico.push({
    numero: num,
    totale: totale,
    mancia: manciaVal,
    coperti: t.coperti||0,
    cameriere: t.cameriere||'',
    pagamento: pagamento || 'cash',
    chiuso: new Date().toISOString(),
    data: todayStr(),
    giri: t.giri
  });
  if (storico.length > 500) storico = storico.slice(-500);
  tavoli[num] = {stato:'libero', cameriere:'', apertoAlle:null, coperti:0, giri:[]};
  saveAll();
  closeOverlay();
  showScreen('cassa'); renderCassa();
}

// ─────────────────────────────────────────────
// REPARTO
// ─────────────────────────────────────────────
function openReparto(rep) {
  currentReparto = rep;
  document.getElementById('reparto-title').textContent = rep;
  renderReparto();
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-reparto').classList.add('active');
  repartoInterval = setInterval(renderReparto, 4000);
}

function renderReparto() {
  tavoli = LS.get('pos-tavoli', {});
  const schede = [];
  Object.entries(tavoli).forEach(([num, t]) => {
    (t.giri||[]).forEach(g => {
      const voci = g.voci.filter(v=>v.reparto===currentReparto && !v.pronto);
      if (voci.length) schede.push({num, gid:g.gid, orario:g.orario, ts:g.ts, voci});
    });
  });
  schede.sort((a,b)=>a.ts-b.ts);

  const el = document.getElementById('reparto-content');
  if (!schede.length) { el.innerHTML='<div style="color:var(--muted);text-align:center;margin-top:60px;grid-column:1/-1;">Nessuna comanda in coda</div>'; return; }

  el.innerHTML = schede.map(s => {
    const fresh = Date.now()-s.ts < 20000;
    // voci in attesa (aspetta antipasto) vs voci normali
    const inAttesa = s.voci.some(v=>v.aspetta);
    const tutteAttesa = s.voci.every(v=>v.aspetta);
    return `<div class="ticket${fresh?' fresh':''}" style="${inAttesa?'border-color:#F2B705;':''}">
      <div class="ticket-header"><span>${tabellaLabel(s.num)}</span><span>🕐 ${s.orario}</span></div>
      ${inAttesa?`<div style="background:#F2B70522;color:#F2B705;font-size:12px;font-weight:700;text-align:center;padding:6px;border-radius:6px;margin-bottom:6px;letter-spacing:.03em">⏳ PRIMA UN ANTIPASTO — IL CAMERIERE TI AVVISA</div>`:''}
      <hr class="ticket-divider">
      ${s.voci.map(v=>`
        <div class="ticket-item" style="${v.aspetta?'color:#F2B705;opacity:0.7;':''}">
          ${v.aspetta?'⏳ ':''} ${v.qty}× ${v.nome}
        </div>
        ${(v.aggiunte||[]).length?`<div class="ticket-note">+ ${v.aggiunte.map(a=>a.nome).join(', ')}</div>`:''}
        ${v.note?`<div class="ticket-note">↳ ${v.note}</div>`:''}`).join('')}
      <div class="ticket-actions">
        <button class="ticket-btn stampa" onclick="stampaComanda('${s.num}','${s.gid}')">🖨️</button>
        ${!tutteAttesa?`<button class="ticket-btn pronto" onclick="segnaPronto('${s.num}','${s.gid}')">✓ Pronto</button>`:''}
      </div>
    </div>`;
  }).join('');
}

function richiedeIlConto(key){
  const richieste = LS.get('richieste-conto', []);
  // evita duplicati
  const exists = richieste.some(r=>r.key===key && Date.now()-r.ts < 60000);
  if(exists) return;
  richieste.push({key, nome: tabellaLabel(key), ts: Date.now()});
  LS.set('richieste-conto', richieste);
  // feedback visivo
  const bar = document.getElementById('tavolo-bottom-bar');
  const btn = bar?.querySelector('button[onclick*="richiedeIlConto"]');
  if(btn){btn.textContent='✓ Cassa avvisata!';btn.style.background='var(--green)22';btn.style.borderColor='var(--green)';btn.style.color='var(--green)';}
}

function cameriereIniziaPizze(num) {
  tavoli = LS.get('pos-tavoli', {});
  const t = tavoli[num]; if(!t) return;
  t.giri = (t.giri||[]).map(g => ({
    ...g, voci: g.voci.map(v => ({...v, aspetta:false}))
  }));
  LS.set('pos-tavoli', tavoli);
  renderTavoloContent(); // aggiorna la vista cameriere
}

function segnaPronto(num, gid) {
  tavoli = LS.get('pos-tavoli', {});
  const t = tavoli[num];
  if (!t) return;
  t.giri = (t.giri||[]).map(g => g.gid!==gid ? g : {...g, voci:g.voci.map(v => v.reparto===currentReparto ? {...v,pronto:true} : v)});
  LS.set('pos-tavoli', tavoli);
  renderReparto();
}

function stampaComanda(num, gid) {
  tavoli = LS.get('pos-tavoli', {});
  const t = tavoli[num];
  if (!t) return;
  const giro = (t.giri||[]).find(g=>g.gid===gid);
  if (!giro) return;
  const voci = giro.voci.filter(v=>v.reparto===currentReparto);
  printComanda(num, giro.orario, voci);
}

// STAMPA
// ─────────────────────────────────────────────
function stampaConto(num) {
  const t = tavoli[num];
  const totImporto = tavoloImporto(t);
  const totCoperti = tavoloCoperti(t);
  const totale = totImporto + totCoperti;
  const allVoci = (t.giri||[]).flatMap(g=>g.voci);

  document.getElementById('print-area').innerHTML = `
    <div class="p-center p-big">${settings.nomeLocale}</div>
    <div class="p-center p-small">${new Date().toLocaleString('it-IT')}</div>
    <div class="p-center">TAVOLO ${num}</div>
    <div class="p-divider"></div>
    ${allVoci.map(v=>{
      const agg=(v.aggiunte||[]).map(a=>`<div style="padding-left:10px;font-size:10px;">+ ${a.nome} (${a.prezzo.toFixed(2)} €)</div>`).join('');
      return `<div class="p-row"><span>${v.qty}× ${v.nome}${v.note?` (${v.note})`:''}</span><span>${((v.prezzoUnitario||v.prezzo)*v.qty).toFixed(2)}</span></div>${agg}`;
    }).join('')}
    ${(t.coperti||0)>0?`<div class="p-row"><span>Coperti ×${t.coperti}</span><span>${totCoperti.toFixed(2)}</span></div>`:''}
    <div class="p-divider"></div>
    <div class="p-row p-big"><span>TOTALE</span><span>${totale.toFixed(2)} €</span></div>
    <div class="p-center p-small" style="margin-top:8px;">Grazie e arrivederci!</div>
  `;
  window.print();
}

function printComanda(num, orario, voci) {
  const {zona, num: tNum} = tabellaInfo(num);
  const zonaLabel = zona ? zona.nome.replace(/[^\w\s]/g,'').trim() : '';
  const tavLabel = (zonaLabel||'Tavolo') + ' / T' + tNum;

  const html = `
    <div style="text-align:center;font-size:20px;font-weight:900;letter-spacing:.05em;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:6px">
      ${currentReparto ? currentReparto.toUpperCase() : 'REPARTO'}
    </div>
    <div style="text-align:center;font-size:13px">${settings.nomeLocale||'Teperino'}</div>
    <div style="border-top:1px dashed #000;margin:6px 0"></div>
    <div style="font-size:18px;font-weight:900">${tavLabel}</div>
    <div style="font-size:13px">🕐 ${orario}</div>
    <div style="border-top:1px dashed #000;margin:6px 0"></div>
    ${voci.map(v=>`
      <div style="font-size:18px;font-weight:700;margin-bottom:2px">${v.qty}× ${v.nome}</div>
      ${(v.aggiunte||[]).length ? `<div style="font-size:13px;padding-left:12px">+ ${v.aggiunte.map(a=>a.nome).join(', ')}</div>` : ''}
      ${v.note ? `<div style="font-size:13px;font-style:italic;padding-left:12px">↳ ${v.note}</div>` : ''}
      ${v.aspetta ? `<div style="font-size:13px;font-weight:700">⏳ PRIMA UN ANTIPASTO</div>` : ''}
    `).join('<div style="border-top:1px dotted #ccc;margin:4px 0"></div>')}
    <div style="border-top:2px solid #000;margin-top:8px;padding-top:4px;text-align:center;font-size:12px">
      ${new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}
    </div>`;

  const w = window.open('','_blank','width=300,height=500');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
    <style>
      *{box-sizing:border-box;margin:0;padding:0;color:#000!important;}
      body{font-family:'Courier New',monospace;font-size:14px;color:#000;padding:4mm;width:80mm;line-height:1.6;}
      @media print{@page{size:80mm auto;margin:1mm;}}
    </style>
  </head><body>${html}</body></html>`);
  w.document.close();
  w.focus();
  setTimeout(()=>{w.print();setTimeout(()=>w.close(),1000);},400);
}

// ─────────────────────────────────────────────
function nextNumAsporto() {
  const oggi = todayStr();
  const todayOrders = asportoOrdini.filter(o => o.data === oggi);
  return todayOrders.length + 1;
}

function nuovoAsporto() {
  const ordine = {
    id: uid(),
    numero: nextNumAsporto(),
    data: todayStr(),
    cliente: '',
    telefono: '',
    stato: 'aperto',
    creatoAlle: nowTime(),
    ts: Date.now(),
    voci: []
  };
  asportoOrdini.push(ordine);
  LS.set('pos-asporto', asportoOrdini);
  openAsportoOrdine(ordine.id);
}

function renderAsportoList() {
  asportoOrdini = LS.get('pos-asporto', []);
  const aperti = asportoOrdini.filter(o => o.stato === 'aperto').sort((a,b) => b.ts - a.ts);
  const el = document.getElementById('asporto-list-content');
  if (!aperti.length) {
    el.innerHTML = `<div style="color:var(--muted);text-align:center;margin-top:60px;">
      Nessun ordine aperto<br><br>
      <button onclick="nuovoAsporto()" class="btn btn-primary" style="width:auto;padding:12px 24px;">🛵 Nuovo ordine</button>
    </div>`;
    return;
  }
  el.innerHTML = aperti.map(o => {
    const tot = o.voci.reduce((s,v)=>s+(v.prezzoUnitario||v.prezzo)*v.qty,0);
    return `<div class="cassa-row" onclick="openAsportoOrdine('${o.id}')">
      <div>
        <div style="font-family:var(--font-display);font-size:20px;">
          #${o.numero} ${o.cliente ? '— '+o.cliente : ''}
        </div>
        <div style="font-size:11px;color:var(--muted);">
          ${o.data} · ${o.creatoAlle}
          ${o.telefono ? ' · 📞 '+o.telefono : ''}
          · ${o.voci.length} voci
        </div>
      </div>
      <div class="cassa-tot">${tot>0?eur(tot):'—'}</div>
    </div>`;
  }).join('');
}

function openAsportoOrdine(id) {
  asportoOrdini = LS.get('pos-asporto', []);
  currentAsporto = id;
  asportoCart = {};
  asportoMenuTab = settings.reparti[0];
  const ordine = asportoOrdini.find(o=>o.id===id);
  if (!ordine) return;
  document.getElementById('asporto-ordine-title').textContent = `Ordine #${ordine.numero}`;
  renderAsportoMenuTabs();
  renderAsportoOrdine();
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-asporto-ordine').classList.add('active');
}

function renderAsportoMenuTabs() {
  const bar = document.getElementById('asporto-menu-tab-bar');
  if (!bar) return;
  const tabs = ['Riepilogo', '🍺 Bar', '🍷 Vino', '📋 Tutte', '🍕 Pizze', '👵 Suocere', '👑 Reali', '📜 Storiche', '🥟 Fritte', '🥖 Panuozzi', '🍟 Antipasti/Fritti', '🍰 Dolci'];
  bar.innerHTML = tabs.map(t => `
    <button onclick="setAsportoTab('${t}')" style="
      white-space:nowrap;padding:6px 14px;border-radius:8px;font-size:12px;
      border:1px solid ${asportoMenuTab===t?'var(--accent)':'var(--border)'};
      background:${asportoMenuTab===t?'var(--accent)':'var(--surface)'};
      color:${asportoMenuTab===t?'#111':'var(--text)'};
      font-family:var(--font-body);cursor:pointer;flex-shrink:0;">${t}</button>
  `).join('');
}

function setAsportoTab(tab) {
  asportoMenuTab = tab;
  renderAsportoMenuTabs();
  renderAsportoOrdine();
}

function renderAsportoOrdine() {
  const ordine = asportoOrdini.find(o=>o.id===currentAsporto);
  if (!ordine) return;
  let html = '';

  // info cliente
  html += `<div class="card">
    <div class="card-label">Dati cliente (opzionale)</div>
    <input class="form-input" placeholder="Nome cliente" value="${ordine.cliente||''}"
      oninput="aggiornaCliente('nome',this.value)" style="margin-bottom:8px;">
    <input class="form-input" placeholder="Telefono" value="${ordine.telefono||''}"
      oninput="aggiornaCliente('telefono',this.value)">
  </div>`;

  // voci già aggiunte
  if (ordine.voci.length > 0) {
    const tot = ordine.voci.reduce((s,v)=>s+(v.prezzoUnitario||v.prezzo)*v.qty,0);
    html += `<div class="card-label" style="padding:0 0 6px;">Ordine</div><div class="card">`;
    ordine.voci.forEach(v => {
      const aggLabel = (v.aggiunte||[]).length ? ` <span style="color:var(--green);font-size:11px;">+ ${v.aggiunte.map(a=>a.nome).join(', ')}</span>` : '';
      html += `<div class="rig">${v.qty}× ${v.nome}${aggLabel}${v.note?` (${v.note})`:''}<span>${eur((v.prezzoUnitario||v.prezzo)*v.qty)}</span></div>`;
    });
    html += `<div class="riepilogo-total"><span>Totale</span><span>${eur(tot)}</span></div></div>`;
    html += `<button class="btn btn-secondary" style="margin-bottom:10px;" onclick="stampaAsporto('${ordine.id}')">🖨️ Stampa ordine</button>`;
  }

  // menu per aggiungere
  if (asportoMenuTab !== 'Riepilogo') {
    const items = getItemsForTab(asportoMenuTab);
    items.forEach(p => {
      const c = asportoCart[p.id] || {qty:0, note:'', aggiunte:[]};
      const hasPizza = isPizza(p);
      const aggExtra = (c.aggiunte||[]).reduce((s,aid)=>{
        const a=(settings.aggiunte||[]).find(x=>x.id===aid); return s+(a?a.prezzo:0);
      },0);
      const prezzoConAgg = p.prezzo + (c.qty>0?aggExtra:0);
      html += `<div class="prod-row">
        <div class="prod-top">
          <div>
            <div class="prod-name">${p.nome}</div>
            <div class="prod-price">${eur(prezzoConAgg)}</div>
          </div>
          <div class="stepper">
            <button class="step-btn" onclick="chAsportoCart('${p.id}',-1)">−</button>
            <div class="step-val" id="aq-${p.id}">${c.qty}</div>
            <button class="step-btn plus" onclick="chAsportoCart('${p.id}',1)">+</button>
          </div>
        </div>
        <div id="aex-${p.id}" style="${c.qty>0&&hasPizza?'':'display:none'}">
          <div style="font-size:11px;color:var(--muted);margin:5px 0 3px;">Aggiunte:</div>
          <input oninput="filtraAgg2('${p.id}',this.value)" placeholder="🔍 Cerca..." style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:4px 8px;color:var(--text);font-size:11px;font-family:var(--font-body);margin-bottom:5px;">
          <div id="agg-list2-${p.id}" style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px;">
            ${(settings.aggiunte||[]).map(a=>{
              const sel=(c.aggiunte||[]).includes(a.id);
              return `<button onclick="toggleAsportoAgg('${p.id}','${a.id}')" style="padding:3px 7px;border-radius:6px;border:1px solid ${sel?'var(--green)':'var(--border)'};background:${sel?'#5AA65522':'var(--surface2)'};color:${sel?'var(--green)':'var(--muted)'};font-size:11px;cursor:pointer;">${a.nome} +${eur(a.prezzo)}</button>`;
            }).join('')}
          </div>
        </div>
        <div id="an-${p.id}" style="${c.qty>0?'':'display:none'}">
          <input class="prod-note" placeholder="Note" id="anote-${p.id}" value="${c.note||''}"
            oninput="asportoCart['${p.id}']={...asportoCart['${p.id}']||{qty:0,aggiunte:[]},note:this.value}">
        </div>
      </div>`;
    });
  }

  document.getElementById('asporto-ordine-content').innerHTML = html;
  renderAsportoBBar();
}

function aggiornaCliente(campo, val) {
  const o = asportoOrdini.find(x=>x.id===currentAsporto);
  if (o) { o[campo]=val; LS.set('pos-asporto', asportoOrdini); }
}

function chAsportoCart(id, delta) {
  const c = asportoCart[id] || {qty:0, note:'', aggiunte:[]};
  c.qty = Math.max(0, c.qty + delta);
  if (c.qty===0) delete asportoCart[id]; else asportoCart[id]=c;
  renderAsportoOrdine();
}

function toggleAsportoAgg(prodId, aggId) {
  const c = asportoCart[prodId]; if(!c) return;
  c.aggiunte = c.aggiunte||[];
  const idx = c.aggiunte.indexOf(aggId);
  const sel = idx===-1;
  if (sel) c.aggiunte.push(aggId); else c.aggiunte.splice(idx,1);
  const list = document.getElementById('agg-list2-'+prodId);
  if(list) list.querySelectorAll('button').forEach(btn=>{
    if(btn.getAttribute('onclick')?.includes("'"+aggId+"'")){
      btn.style.borderColor = sel?'var(--green)':'var(--border)';
      btn.style.background  = sel?'#5AA65522':'var(--surface2)';
      btn.style.color       = sel?'var(--green)':'var(--muted)';
    }
  });
  renderAsportoBBar();
}

function renderAsportoBBar() {
  const items = Object.entries(asportoCart).filter(([,v])=>v.qty>0);
  const tot = items.reduce((s,[id,v])=>{
    const p=menu.find(m=>m.id===id); if(!p) return s;
    const aggE=(v.aggiunte||[]).reduce((ss,aid)=>{const a=(settings.aggiunte||[]).find(x=>x.id===aid);return ss+(a?a.prezzo:0)},0);
    return s+(p.prezzo+aggE)*v.qty;
  },0);
  const bar = document.getElementById('asporto-ordine-bbar');
  if (!items.length) {
    // mostra solo pulsante incassa se ci sono già voci nell'ordine
    const ordine = asportoOrdini.find(o=>o.id===currentAsporto);
    if (ordine && ordine.voci.length>0) {
      const totOrdine = ordine.voci.reduce((s,v)=>s+(v.prezzoUnitario||v.prezzo)*v.qty,0);
      bar.innerHTML=`<button class="btn btn-success" onclick="showAsportoPagamento('${currentAsporto}',${totOrdine})">Incassa — ${eur(totOrdine)}</button>`;
    } else { bar.innerHTML=''; }
    return;
  }
  bar.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
    <button class="btn btn-primary" onclick="aggiungiAsporto()">➕ Aggiungi — ${eur(tot)}</button>
    ${(asportoOrdini.find(o=>o.id===currentAsporto)||{voci:[]}).voci.length>0?
      `<button class="btn btn-success" onclick="aggiungiEIncassa()">✓ Incassa</button>`:''}
  </div>`;
}

function aggiungiAsporto() {
  const items = Object.entries(asportoCart).filter(([,v])=>v.qty>0);
  if (!items.length) return;
  const ordine = asportoOrdini.find(o=>o.id===currentAsporto);
  if (!ordine) return;
  items.forEach(([id,v]) => {
    const p = menu.find(m=>m.id===id); if(!p) return;
    const aggSel = (v.aggiunte||[]).map(aid=>{const a=(settings.aggiunte||[]).find(x=>x.id===aid);return a?{id:a.id,nome:a.nome,prezzo:a.prezzo}:null}).filter(Boolean);
    const aggE = aggSel.reduce((s,a)=>s+a.prezzo,0);
    ordine.voci.push({vid:uid(),prodottoId:id,nome:p.nome,prezzo:p.prezzo,prezzoUnitario:p.prezzo+aggE,aggiunte:aggSel,reparto:p.reparto,qty:v.qty,note:v.note||''});
  });
  LS.set('pos-asporto', asportoOrdini);
  asportoCart = {};
  renderAsportoOrdine();
}

function aggiungiEIncassa() {
  aggiungiAsporto();
  setTimeout(()=>{
    const ordine = asportoOrdini.find(o=>o.id===currentAsporto);
    if (!ordine) return;
    const tot = ordine.voci.reduce((s,v)=>s+(v.prezzoUnitario||v.prezzo)*v.qty,0);
    showAsportoPagamento(currentAsporto, tot);
  }, 100);
}

function showAsportoPagamento(id, totale) {

  document.getElementById('overlay-text').innerHTML = `

function showAsportoMancia(id, totale) {

    <div style="font-size:13px;color:var(--muted);margin-bottom:6px;">Mancia sul POS (opzionale)</div>
    <input type="number" id="mancia-asporto" step="0.50" min="0" placeholder="0,00"

      <button onclick="chiudiAsporto('${id}',${totale},'pos',parseFloat(document.getElementById('mancia-asporto').value)||0)" style="background:var(--green);border:none;color:#111;border-radius:8px;padding:10px;cursor:pointer;font-family:var(--font-body);font-size:13px;font-weight:700;">✓ Chiudi</button>
    </div>`;

function chiudiAsporto(id, totale, pagamento, mancia) {
  const ordine = asportoOrdini.find(o=>o.id===id);
  if (!ordine) return;
  ordine.stato = 'chiuso';
  LS.set('pos-asporto', asportoOrdini);
  // salva in storico con tipo asporto
  storico.push({
    tipo: 'asporto',
    numero: ordine.numero,
    cliente: ordine.cliente||'',
    totale, mancia: mancia||0,
    pagamento, coperti:0,
    chiuso: new Date().toISOString(),
    data: todayStr(),
    giri: [{voci: ordine.voci}]
  });
  if (storico.length>500) storico=storico.slice(-500);
  LS.set('pos-storico', storico);
  closeOverlay();
  showScreen('asporto'); renderAsportoList();
}

function stampaAsporto(id) {
  const o = asportoOrdini.find(x=>x.id===id); if(!o) return;

function setPeriodo(p) {
  currentPeriodo = p;
  document.querySelectorAll('#stat-tabs .tab').forEach(t=>t.classList.remove('active'));
  event.target.classList.add('active');
  renderStatistiche();
}

function renderStatistiche() {
  storico = LS.get('pos-storico', []);
  const now = Date.now();
  const msDay = 86400000;
  const filtered = storico.filter(s => {
    const ts = new Date(s.chiuso).getTime();
    if (currentPeriodo==='oggi') { const d=new Date(); d.setHours(0,0,0,0); return ts>=d.getTime(); }
    if (currentPeriodo==='settimana') return ts>=now-7*msDay;
    if (currentPeriodo==='mese') return ts>=now-30*msDay;
    return true;
  });

  const filtTavoli  = filtered.filter(x=>x.tipo!=='asporto');
  const filtAsporto = filtered.filter(x=>x.tipo==='asporto');

  const incasso    = filtered.reduce((s,x)=>s+(x.totale||0),0);
  const scontrini  = filtTavoli.length;
  const nAsporto   = filtAsporto.length;
  const medio      = scontrini ? filtTavoli.reduce((s,x)=>s+(x.totale||0),0)/scontrini : 0;
  const coperti    = filtTavoli.reduce((s,x)=>s+(x.coperti||0),0);
  const incTavoli  = filtTavoli.reduce((s,x)=>s+(x.totale||0),0);
  const incAsporto = filtAsporto.reduce((s,x)=>s+(x.totale||0),0);
  const incCash    = filtered.filter(x=>x.pagamento==='cash'||!x.pagamento).reduce((s,x)=>s+(x.totale||0),0);
  const incPos     = filtered.filter(x=>x.pagamento==='pos').reduce((s,x)=>s+(x.totale||0),0);
  const totMance   = filtered.reduce((s,x)=>s+(x.mancia||0),0);
  const incNetto   = incasso - totMance;

  // prodotti
  const prods = {};
  filtered.forEach(s=>(s.giri||[]).forEach(g=>g.voci.forEach(v=>{
    if(!prods[v.nome]) prods[v.nome]={nome:v.nome,qty:0,inc:0};
    prods[v.nome].qty+=v.qty; prods[v.nome].inc+=v.prezzo*v.qty;
  })));
  const topProds = Object.values(prods).sort((a,b)=>b.inc-a.inc).slice(0,10);
  const maxInc   = topProds[0]?.inc || 1;

  // per giorno
  const byDay = {};
  filtered.forEach(s=>{ byDay[s.data||'?']=(byDay[s.data||'?']||0)+(s.totale||0); });
  const days = Object.entries(byDay).sort((a,b)=>a[0].localeCompare(b[0]));
  const maxDay = Math.max(...days.map(([,v])=>v),1);

  let html = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Incasso totale</div><div class="stat-value" style="color:var(--gold);">${eur(incasso)}</div></div>
      <div class="stat-card"><div class="stat-label">💵 Cash</div><div class="stat-value" style="color:var(--gold);">${eur(incCash)}</div></div>
      <div class="stat-card"><div class="stat-label">💳 POS (lordo)</div><div class="stat-value" style="color:var(--green);">${eur(incPos)}</div></div>
      ${totMance>0?`<div class="stat-card" style="border-color:#E8541C44;"><div class="stat-label">🎁 Mance POS</div><div class="stat-value" style="color:var(--accent);">${eur(totMance)}</div></div>
      <div class="stat-card" style="border-color:#5AA65544;"><div class="stat-label">✓ Incasso netto</div><div class="stat-value" style="color:var(--green);">${eur(incNetto)}</div></div>`:''}
    </div>
    ${totMance>0?`<div style="margin:0 16px 8px;background:#E8541C11;border:1px solid #E8541C33;border-radius:10px;padding:12px;">
      <div style="font-size:11px;color:var(--accent);font-weight:600;margin-bottom:3px;">📋 MANCE DA RESTITUIRE</div>
      <div style="font-size:13px;color:var(--text);">Preleva <strong style="color:var(--accent);">${eur(totMance)}</strong> dal POS e consegna allo staff.</div>
    </div>`:''}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 10px;">
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;">
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px;">🍕 TAVOLI</div>
        <div style="font-family:var(--font-display);font-size:20px;color:var(--gold);">${eur(incTavoli)}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:3px;">${scontrini} tavoli · ${coperti} cop. · media ${eur(medio)}</div>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;">
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px;">🛵 ASPORTO</div>
        <div style="font-family:var(--font-display);font-size:20px;color:var(--accent);">${eur(incAsporto)}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:3px;">${nAsporto} ordini · media ${eur(nAsporto?incAsporto/nAsporto:0)}</div>
      </div>
    </div>
`;

  if (days.length > 0) {
    html += `<div class="bar-chart" style="margin-top:16px;">
      <div class="card-label" style="padding:0 0 10px;">Incasso per giorno</div>
      ${days.map(([d,v])=>`
        <div class="bar-row">
          <div class="bar-name">${d}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(v/maxDay*100).toFixed(1)}%"></div></div>
          <div class="bar-val">${eur(v)}</div>
        </div>`).join('')}
    </div>`;
  }

  if (topProds.length > 0) {
    html += `<div class="bar-chart" style="margin-top:8px;">
      <div class="card-label" style="padding:0 0 10px;">Prodotti più venduti</div>
      ${topProds.map((p,i)=>`
        <div class="bar-row">
          <div class="bar-name"><span style="color:var(--border);margin-right:4px;">${i+1}</span>${p.nome} <span style="color:var(--muted);font-size:11px;">×${p.qty}</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${(p.inc/maxInc*100).toFixed(1)}%;background:var(--green);"></div></div>
          <div class="bar-val">${eur(p.inc)}</div>
        </div>`).join('')}
    </div>`;
  }

  if (!filtered.length) html += '<div style="color:var(--muted);text-align:center;margin:40px 0;">Nessuna vendita nel periodo selezionato</div>';
  document.getElementById('stat-content').innerHTML = html;
}

function saveLocale() {
  settings.nomeLocale = document.getElementById('imp-nome').value.trim() || settings.nomeLocale;
  settings.numTavoli  = parseInt(document.getElementById('imp-tavoli').value)||settings.numTavoli;
  settings.prezzoCoperto = parseFloat(document.getElementById('imp-coperto').value)||0;
  LS.set('pos-settings', settings);
  ensureTavoli();

    const totCart=Object.entries(cart).reduce((s,[k,v])=>{const prodId=v.prodottoId||k;const p=menu.find(m=>m.id===prodId);return s+(p?(p.prezzo)*v.qty:0);},0);

function chCop(d){
  if(!currentTavolo) return;
  if(!tavoli[currentTavolo]) tavoli[currentTavolo]={stato:'libero',cameriere:camName,apertoAlle:nowTime(),coperti:0,giri:[]};
  const t=tavoli[currentTavolo];
  t.coperti=Math.max(0,(t.coperti||0)+d);
  if(t.coperti>0&&t.stato==='libero'){t.stato='occupato';t.apertoAlle=nowTime();}
  LS.set('pos-tavoli',tavoli);
  if(window.fbSet) window.fbSet('t',tavoli);
  const el=document.getElementById('cop-val');
  if(el) el.textContent=t.coperti;
}

function aggProd(id){
  const p=menu.find(m=>m.id===id);if(!p) return;
  if(p.reparto==='Bar'){
    const c=cart[id]||{qty:0,aggiunte:[],prodottoId:id};
    c.qty++;cart[id]=c;
  } else {
    const k=id+'_'+Date.now();
    cart[k]={qty:1,aggiunte:[],note:'',prodottoId:id};
  }
  window.buildOrdinazione();
}

function mostraAggiunte(cartKey,prodId){
  const p=menu.find(m=>m.id===prodId);if(!p) return;
  const ov=document.getElementById('login-overlay');
  const aggs=settings.aggiunte||[];
  function aggHtml(){
    const c=cart[cartKey];
    return aggs.map(a=>{
      const sel=(c.aggiunte||[]).includes(a.id);
      return '<button onclick="togAgg(\''+cartKey+'\',\''+a.id+'\')" style="padding:8px 12px;border-radius:8px;border:1px solid '+(sel?'var(--green)':'var(--border)')+';background:'+(sel?'#5AA65522':'var(--surface2)')+';color:'+(sel?'var(--green)':'var(--text)')+';font-size:13px;cursor:pointer;">'+a.nome+' <span style=\'color:var(--muted)\'>+'+eur(a.prezzo)+'</span></button>';
    }).join('');
  }
  function render(){
    const aggs=settings.aggiunte||[];
    const isPizza=p.reparto==='Pizzeria';
    ov.innerHTML=
      '<div style="width:100%;max-width:520px;">'+
      '<div style="font-family:var(--font-display);font-size:22px;color:var(--accent);margin-bottom:4px;">'+p.nome+'</div>'+
      '<div style="font-size:13px;color:var(--muted);margin-bottom:14px;">'+eur(p.prezzo)+' base</div>'+
      (isPizza&&aggs.length?
        '<div style="font-size:12px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em;">Aggiunte</div>'+
        '<div id="agg-chips" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;">'+aggHtml()+'</div>'
        :'')+
      '<div style="font-size:12px;color:var(--muted);margin-bottom:6px;">Nota</div>'+
      '<input id="agg-note" placeholder="es. senza cipolla, ben cotto..." value="'+(cart[cartKey].note||'')+'" oninput="cart[\''+cartKey+'\'].note=this.value" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px;margin-bottom:14px;box-sizing:border-box;">'+
      '<div style="display:flex;gap:8px;">'+
      '<button onclick="delete cart[\''+cartKey+'\'];window.buildOrdinazione()" style="flex:1;padding:14px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);font-size:14px;cursor:pointer;">Annulla</button>'+
      '<button onclick="window.buildOrdinazione()" style="flex:2;padding:14px;border-radius:10px;background:var(--accent);border:none;color:#111;font-size:16px;font-weight:700;cursor:pointer;">✓ Conferma</button>'+
      '</div></div>';
  }
  window.togAgg=function(ck,aid){
    const c=cart[ck];if(!c) return;
    c.aggiunte=c.aggiunte||[];
    const i=c.aggiunte.indexOf(aid);
    if(i===-1) c.aggiunte.push(aid); else c.aggiunte.splice(i,1);
    document.getElementById('agg-chips').innerHTML=aggHtml();
  };
  render();
}

function inviaOrdine(key, aspettaAntipasto){
  const ci=Object.entries(cart).filter(([,v])=>v.qty>0);
  if(!ci.length) return;
  if(aspettaAntipasto===undefined){
    const haPizze=ci.some(([k,v])=>{
      const p=menu.find(m=>m.id===(v.prodottoId||k));
      return p&&p.reparto==='Pizzeria'&&!p.cat; // solo pizze vere, non fritte/speciali
    });
    const haAntipas=ci.some(([k,v])=>{
      const p=menu.find(m=>m.id===(v.prodottoId||k));
      return p&&(p.reparto==='Cucina'||p.cat==='Cucina')&&p.cat!=='Dolci';
    });
    if(haPizze&&haAntipas){
      const ov=document.getElementById('login-overlay');
      const k2=key;
      ov.innerHTML=`<div style="width:100%;max-width:400px;text-align:center;">
        <div style="font-size:18px;font-weight:700;color:var(--text);margin-bottom:8px;">Ordine misto</div>
        <div style="font-size:14px;color:var(--muted);margin-bottom:20px;">Ci sono sia antipasti che pizze.<br>Vuoi che il pizzaiolo aspetti?</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <button onclick="inviaOrdine('${k2}',true)" style="padding:16px;border-radius:12px;border:2px solid var(--gold);background:#F2B70522;color:var(--gold);font-size:14px;font-weight:700;cursor:pointer;line-height:1.4">🕐 Pizze dopo gli antipasti</button>
          <button onclick="inviaOrdine('${k2}',false)" style="padding:16px;border-radius:12px;border:2px solid var(--green);background:#5AA65522;color:var(--green);font-size:14px;font-weight:700;cursor:pointer;line-height:1.4">🍕 Manda tutto subito</button>
        </div>
        <button onclick="entraTavolo('${k2}')" style="width:100%;margin-top:10px;padding:10px;border-radius:10px;background:none;border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:13px;">Annulla</button>
      </div>`;
      return;
    }
    aspettaAntipasto=false;
  }
  const voci=ci.map(([k,v])=>{
    const prodId=v.prodottoId||k;
    const p=menu.find(m=>m.id===prodId);if(!p) return null;
    const aggSel=(v.aggiunte||[]).map(aid=>{const a=(settings.aggiunte||[]).find(x=>x.id===aid);return a?{id:a.id,nome:a.nome,prezzo:a.prezzo}:null;}).filter(Boolean);
    const ext=aggSel.reduce((s,a)=>s+a.prezzo,0);
    const aspetta=aspettaAntipasto&&p.reparto==='Pizzeria';
    return{vid:uid(),prodottoId:prodId,nome:p.nome,prezzo:p.prezzo,prezzoUnitario:p.prezzo+ext,aggiunte:aggSel,reparto:p.reparto,qty:v.qty,note:v.note||'',pronto:false,aspetta:aspetta||false};
  }).filter(Boolean);
  if(!tavoli[key]) tavoli[key]={stato:'libero',cameriere:camName,apertoAlle:nowTime(),coperti:0,giri:[]};
  const t=tavoli[key];
  t.stato='occupato';t.cameriere=camName;
  if(!t.apertoAlle) t.apertoAlle=nowTime();
  const giro={gid:uid(),orario:nowTime(),ts:Date.now(),voci,fonte:'teperino'};
  t.giri=[...(t.giri||[]),giro];
  LS.set('pos-tavoli',tavoli);

  // ---- CODA STAMPA AUTOMATICA ----
  // Raggruppa voci per reparto e scrive in pos/printQueue
  if(window.fbSet){
    const byReparto={};
    voci.forEach(v=>{
      const rep=v.reparto||'Bar';
      if(!byReparto[rep]) byReparto[rep]=[];
      byReparto[rep].push({nome:v.nome,qty:v.qty,note:v.note||'',aggiunte:v.aggiunte||[]});
    });
    Object.entries(byReparto).forEach(([reparto,items])=>{
      const qKey='q'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
      window.fbSet('printQueue/'+qKey,{
        tavolo:key,
        reparto,
        cameriere:camName||'',
        coperti:t.coperti||0,
        items,
        ts:Date.now()
      });
    });
  }
  // ---------------------------------

  cart={};
  mostraSala(activeZona);
}

function aggiornaTavoli(){
  if(window.fbGet){
    window.fbGet('t').then(val=>{
      if(val){
        // prende solo i tavoli che hanno giri recenti (ultimi 12 ore)
        const ora=Date.now();
        const cutoff=ora-(12*60*60*1000);
        const filtrati={};
        Object.entries(val).forEach(([k,t])=>{
          if(t&&t.stato==='occupato'){
            const ultimoTs=Math.max(...(t.giri||[]).map(g=>g.ts||0));
            if(ultimoTs>cutoff) filtrati[k]=t;
          }
        });
        tavoli=filtrati;
      } else {
        tavoli={};
      }
      localStorage.setItem('pos-tavoli',JSON.stringify(tavoli));
      mostraSala(activeZona);
    }).catch(()=>mostraSala(activeZona));
  } else {
    tavoli=LS.get('pos-tavoli',{});
    mostraSala(activeZona);
  }
}

function mostraSala(zona){
  zona = zona || 'terrazza';
  activeZona = zona;
  const zone=[{id:'terrazza',nome:'Terrazza',num:36},{id:'sala1',nome:'Sala 1',num:12},{id:'sala2',nome:'Sala 2',num:8},{id:'sofa',nome:'Sofà 🛋️',num:3}];
  const z=zone.find(x=>x.id===zona)||zone[0];
  const tv=typeof tavoli!=='undefined'?tavoli:{};
  let grid='';
  for(let i=1;i<=z.num;i++){
    const k=z.id+'_'+i;
    const t=tv[k];
    const occ=t&&t.stato==='occupato';
    grid+='<button onclick="entraTavolo(\''+k+'\')" style="aspect-ratio:1;border-radius:10px;border:'+(occ?'3px solid var(--accent)':'1px solid var(--border)')+';background:'+(occ?'var(--accent)':'var(--surface2)')+';display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;"><span style="font-size:18px;font-weight:700;color:'+(occ?'#111':'var(--text)')+'">'+i+'</span>'+(occ?'<span style="font-size:9px;color:#111">'+eur(tavoloTotale(t))+'</span>':'')+'</button>';
  }
  const tabBtns=zone.map(zo=>'<button onclick="mostraSala(\''+zo.id+'\')" style="flex:1;padding:8px;border-radius:8px;background:'+(zona===zo.id?'var(--accent)':'var(--surface2)')+';border:'+(zona===zo.id?'none':'1px solid var(--border)')+';color:'+(zona===zo.id?'#111':'var(--text)')+';font-weight:700;cursor:pointer;font-size:13px;">'+zo.nome+'</button>').join('');
  document.getElementById('login-overlay').innerHTML=
    '<div style="width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;">'+
    '<div style="display:flex;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);margin-bottom:10px;">'+
    '<span style="font-family:var(--font-display);font-size:20px;color:var(--accent);flex:1">🍕 Teperino</span>'+
    '<span style="font-size:13px;font-weight:700;color:var(--accent);">👤 '+camName+'</span>'+
    '<button onclick="aggiornaTavoli()" style="margin-left:8px;padding:4px 8px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:12px;">🔄</button>'+
    '<button onclick="location.reload()" style="margin-left:6px;padding:4px 10px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:12px;">Esci</button>'+
    '</div>'+
    '<div style="display:flex;gap:6px;margin-bottom:10px;">'+tabBtns+'</div>'+
    '<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;overflow-y:auto;flex:1;">'+grid+'</div>'+
    '</div>';
}

function mostraTavolo(key){
  const {zona,num}=tabellaInfo(key);
  const t=tavoli[key]||{stato:'libero',coperti:0,giri:[]};
  const voci=(t.giri||[]).flatMap(g=>g.voci||[]);
  const tot=voci.reduce((s,v)=>s+(v.prezzoUnitario||v.prezzo)*v.qty,0);
  let righe=voci.length?voci.map(v=>'<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;"><span>'+v.qty+'× '+v.nome+'</span><span style="color:var(--gold)">'+eur((v.prezzoUnitario||v.prezzo)*v.qty)+'</span></div>').join(''):'<div style="color:var(--muted);font-size:13px;padding:10px 0">Nessuna comanda inviata</div>';
  document.getElementById('login-overlay').innerHTML=
    '<div style="width:100%;max-width:520px;">'+
    '<div style="display:flex;align-items:center;margin-bottom:14px;">'+
    '<button onclick="mostraSala(\''+activeZona+'\')" style="padding:8px 14px;border-radius:8px;background:var(--accent);border:none;color:#111;font-weight:700;cursor:pointer;font-size:15px;margin-right:12px;">⬅ Sala</button>'+
    '<span style="font-family:var(--font-display);font-size:22px;color:var(--accent);">T'+num+' — '+(zona?zona.nome:'')+'</span>'+
    '<span style="margin-left:auto;font-size:13px;color:var(--muted);">👤 '+camName+'</span>'+
    '</div>'+
    '<div style="background:var(--surface2);border-radius:10px;padding:12px;margin-bottom:12px;max-height:200px;overflow-y:auto;">'+righe+'</div>'+
    (tot>0?'<div style="display:flex;justify-content:space-between;font-size:16px;font-weight:700;margin-bottom:12px;"><span>Totale</span><span style="color:var(--gold)">'+eur(tot)+'</span></div>':'')+
    '<button onclick="entraTavolo(\''+key+'\')" style="width:100%;padding:16px;border-radius:12px;background:var(--accent);border:none;color:#111;font-size:18px;font-weight:700;cursor:pointer;">📝 Prendi comanda</button>'+
    '<button onclick="richiedeIlConto(\''+key+'\');mostraSala(\''+activeZona+'\')" style="width:100%;padding:12px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:14px;cursor:pointer;margin-top:8px;">🧾 Chiede il conto</button>'+
    '</div>';
}

function doZona(zonaId, num, btn){
  mostraSala(zonaId);
}
