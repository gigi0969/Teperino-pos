<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teperino — Cassa</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');
:root{--bg:#0F0D0B;--surf:#1A1713;--surf2:#242018;--bord:#332E26;--txt:#F0EAE0;--mut:#9A9080;--acc:#E8541C;--gold:#F2B705;--grn:#5AA655;--red:#C94040;--fd:'Bebas Neue',sans-serif;--fb:'Inter',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:var(--fb);height:100vh;overflow:hidden;display:flex;flex-direction:column;}
/* TOPBAR */
.tb{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--bord);background:var(--surf);flex-shrink:0;}
.logo{font-family:var(--fd);font-size:26px;color:var(--acc);letter-spacing:.04em;}
.tb-time{font-family:'JetBrains Mono',monospace;font-size:17px;color:var(--gold);margin-left:auto;}
.tb-btn{background:var(--surf2);border:1px solid var(--bord);color:var(--txt);border-radius:8px;padding:6px 12px;font-size:12px;font-family:var(--fb);cursor:pointer;}
.tb-btn:hover{border-color:var(--acc);}
/* MAIN */
.main{display:flex;flex:1;overflow:hidden;}
/* ── POS ORDER MODE ── */
.pos-wrap{display:none;flex:1;overflow:hidden;flex-direction:column;}
.pos-wrap.active{display:flex;}
.asp-wrap{display:none;flex:1;overflow:hidden;flex-direction:column;background:var(--bg);}
.asp-wrap.active{display:flex;}
.map-wrap{display:flex;flex:1;overflow:hidden;}
.map-wrap.hidden{display:none;}
.pos-left{flex:1.15;display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--bord);background:#EDE7DD;min-width:0;}
.pos-right{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);min-width:0;}
.pos-hdr{padding:7px 14px;background:var(--surf2);border-bottom:1px solid var(--bord);display:flex;align-items:center;gap:12px;flex-shrink:0;}
.pos-back{background:var(--acc);border:none;color:#111;border-radius:10px;padding:12px 22px;font-size:18px;font-weight:700;cursor:pointer;font-family:var(--fd);letter-spacing:.04em;display:flex;align-items:center;gap:7px;}
.pos-back:hover{filter:brightness(1.1);}
.pos-thead{display:flex;padding:5px 10px;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--bord);background:var(--surf2);flex-shrink:0;}
.pos-order{flex:1;overflow-y:auto;overflow-x:hidden;min-width:0;}
.pos-row{display:flex;align-items:center;padding:10px;border-bottom:1px solid #D9D2C4;cursor:pointer;gap:4px;min-width:0;}
.pos-row:hover{background:#E2DBCC;}
.pos-row.sel{background:#E8541C14;border-left:3px solid var(--acc);}
.pos-left .pqty{width:34px;font-size:16px;font-weight:700;color:var(--acc);flex-shrink:0;}
.pos-left .pname{flex:1;min-width:90px;font-size:14px;font-weight:500;overflow:hidden;white-space:normal;line-height:1.3;color:#1C1814;word-break:break-word;}
.pos-left .pprc{width:58px;font-size:12px;color:#8A8076;text-align:right;flex-shrink:0;}
.pos-left .ptot{width:64px;font-size:15px;font-weight:700;text-align:right;flex-shrink:0;color:#1C1814;}
.pos-total-bar{padding:8px 12px;border-top:2px solid var(--bord);background:var(--surf2);flex-shrink:0;}
.pos-plpanel{width:150px;flex-shrink:0;padding:8px 6px;border-right:1px solid var(--bord);background:var(--surf2);display:flex;flex-direction:column;overflow:hidden;}
.pos-total-num{font-family:var(--fd);font-size:30px;color:var(--gold);}
.pos-acts{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:7px 8px;border-top:1px solid var(--bord);flex-shrink:0;}
.pact{border-radius:9px;padding:9px 4px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--bord);background:var(--surf);color:var(--txt);display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--fb);}
.pact:hover{filter:brightness(1.1);}
.pact.pr{background:var(--acc);border-color:var(--acc);color:#111;}
.pact.pg{background:var(--grn);border-color:var(--grn);color:#111;}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:8px;overflow-y:auto;flex:1;align-content:start;}
.cat-btn{border-radius:12px;border:2px solid transparent;cursor:pointer;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;font-weight:700;font-size:11px;font-family:var(--fb);transition:filter .1s;}
.cat-btn:hover,.cat-btn.on{filter:brightness(1.15);border-color:#fff4;}
.cat-icon{font-size:28px;line-height:1;}
.pos-items{flex:1;overflow-y:auto;padding:7px;}
.pit{width:100%;background:var(--surf);border:1px solid var(--bord);border-radius:9px;padding:9px 12px;margin-bottom:4px;cursor:pointer;text-align:left;font-family:var(--fb);display:flex;justify-content:space-between;align-items:center;}
.pit:hover{background:var(--surf2);border-color:var(--acc);}
.pit-n{font-size:16px;font-weight:600;color:var(--txt);}
.pit-p{font-size:12px;color:var(--gold);font-weight:600;}
.pos-cat-hdr{padding:6px 10px 2px;display:flex;align-items:center;gap:6px;flex-shrink:0;border-bottom:1px solid var(--bord);}
/* LEFT */
.left{flex:1;display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--bord);}
.ltabs{display:flex;border-bottom:1px solid var(--bord);flex-shrink:0;}
.ltab{flex:1;padding:9px;text-align:center;font-family:var(--fd);font-size:17px;letter-spacing:.02em;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent;}
.ltab.on{color:var(--acc);border-bottom-color:var(--acc);}
.lbody{flex:1;overflow-y:auto;padding:6px 8px;}
/* TAVOLI */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:9px;}
.tcard{aspect-ratio:1;border-radius:10px;border:1px solid var(--bord);background:var(--surf);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .12s;position:relative;width:100%;}
.tcard:hover{background:var(--surf2);}
.tcard.occ{border-color:var(--acc);background:#E8541C12;}
.tcard.occ:hover{background:#E8541C22;}
.tcard.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold);}
.tnum{font-family:var(--fd);font-size:26px;line-height:1;}
.ttot{font-size:10px;color:var(--gold);font-weight:700;margin-top:1px;}
.tcam{font-size:9px;color:var(--mut);margin-top:1px;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ttime{font-size:9px;color:var(--acc);margin-top:1px;font-weight:600;}
.tdot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:12px;background:var(--acc);}
/* RIGHT */
.right{width:380px;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;transition:width .2s;}
.right.hidden{width:0;overflow:hidden;}
.rh{padding:10px 14px;border-bottom:1px solid var(--bord);background:var(--surf);flex-shrink:0;}
.rtitle{font-family:var(--fd);font-size:21px;color:var(--acc);letter-spacing:.02em;}
.rsub{font-size:11px;color:var(--mut);margin-top:1px;}
.rbody{flex:1;overflow-y:auto;padding:12px;}
.rfooter{padding:10px 12px;border-top:1px solid var(--bord);background:var(--surf);flex-shrink:0;}
/* COMPONENTS */
.card{background:var(--surf);border:1px solid var(--bord);border-radius:10px;padding:11px;margin-bottom:10px;}
.lbl{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;}
.stepper{display:flex;align-items:center;gap:7px;}
.sbtn{width:28px;height:28px;border-radius:7px;border:1px solid var(--bord);background:var(--surf2);color:var(--txt);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;}
.sbtn.plus{background:var(--acc);border-color:var(--acc);color:#111;}
.sval{min-width:22px;text-align:center;font-size:14px;font-weight:600;}
.row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px;}
.row.mu{color:var(--mut);}
.rowtot{display:flex;justify-content:space-between;font-size:17px;font-weight:700;padding-top:7px;margin-top:5px;border-top:1px solid var(--bord);}
.rowtot span:last-child{color:var(--gold);}
/* MENU */
.mtabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;}
.mtab{padding:4px 11px;border-radius:7px;font-size:11px;border:1px solid var(--bord);cursor:pointer;background:var(--surf);color:var(--txt);font-family:var(--fb);}
.mtab.on{background:var(--acc);color:#111;border-color:var(--acc);}
.prow{display:flex;align-items:center;padding:7px 9px;background:var(--surf);border:1px solid var(--bord);border-radius:8px;margin-bottom:4px;gap:8px;}
.pname{font-size:13px;font-weight:500;flex:1;}
.pprice{font-size:11px;color:var(--mut);}
.padd{width:26px;height:26px;border-radius:6px;border:none;background:var(--acc);color:#111;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;}
/* AGGIUNTE */
.aggbox{background:var(--surf2);border:1px solid var(--bord);border-radius:8px;padding:8px;margin-top:3px;}
.agglbl{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;}
.aggchips{display:flex;flex-wrap:wrap;gap:3px;}
.chip{padding:2px 7px;border-radius:5px;border:1px solid var(--bord);background:var(--surf);color:var(--mut);font-size:10px;cursor:pointer;}
.chip.on{border-color:var(--grn);background:#5AA65514;color:var(--grn);}
.fi{width:100%;background:var(--surf);border:1px solid var(--bord);border-radius:7px;padding:7px 10px;color:var(--txt);font-family:var(--fb);font-size:12px;}
.fi:focus{outline:none;border-color:var(--acc);}
/* BTNS */
.btn{border-radius:9px;padding:10px 14px;font-family:var(--fb);font-size:13px;font-weight:600;cursor:pointer;border:none;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;}
.btn:hover{filter:brightness(1.08);}
.btn-p{background:var(--acc);color:#111;}
.btn-s{background:var(--surf2);border:1px solid var(--bord);color:var(--txt);}
.btn-ok{background:var(--grn);color:#111;}
.btn-g{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
/* SIDE PANEL */
.sov{display:none;position:fixed;inset:0;background:#000000AA;z-index:100;}
.sov.on{display:block;}
.spanel{display:none;position:fixed;top:0;right:0;width:440px;height:100vh;background:var(--surf);border-left:1px solid var(--bord);z-index:101;flex-direction:column;box-shadow:-4px 0 20px #00000060;}
.spanel.on{display:flex;}
.sph{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--bord);flex-shrink:0;}
.sptitle{font-family:var(--fd);font-size:21px;color:var(--acc);flex:1;}
.spclose{background:none;border:none;color:var(--mut);font-size:20px;cursor:pointer;}
.spbody{flex:1;overflow-y:auto;padding:12px;}
/* OV */
.ov{position:fixed;inset:0;background:#000000CC;display:flex;align-items:center;justify-content:center;z-index:500;padding:20px;}
.ovbox{background:var(--surf);border:1px solid var(--bord);border-radius:14px;padding:22px;width:100%;max-width:360px;}
.ovt{font-family:var(--fd);font-size:21px;margin-bottom:7px;}
.ovtx{font-size:12px;color:var(--mut);margin-bottom:16px;line-height:1.5;}
/* STAT */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px;}
.sc{background:var(--bg);border:1px solid var(--bord);border-radius:8px;padding:10px 12px;}
.slbl{font-size:10px;color:var(--mut);margin-bottom:2px;}
.sval{font-family:var(--fd);font-size:19px;letter-spacing:.02em;}
/* PRINT */
@media print{
  body *{visibility:hidden!important;}
  #pa,#pa *{visibility:visible!important;}
  #pa{position:fixed;top:0;left:0;width:80mm;background:#fff;color:#000;}
  @page{size:80mm auto;margin:4mm;}
  #pa .pc{text-align:center;}
  #pa .pb{font-weight:bold;}
  #pa .ppb{font-size:14px;font-weight:bold;}
  #pa .pd{border-top:1px dashed #000;margin:5px 0;}
  #pa .ps{font-size:10px;}
}
#pa{display:none;font-family:'JetBrains Mono',monospace;font-size:12px;color:#000;line-height:1.6;}
/* ASP ROW */
.asprow{background:var(--surf);border:1px solid var(--bord);border-radius:9px;padding:11px 13px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin-bottom:7px;}
.asprow:hover,.asprow.sel{border-color:var(--gold);}
</style>
</head>

function tImporto(t){if(!t) return 0; return(t.giri||[]).reduce((s,g)=>s+g.voci.reduce((ss,v)=>ss+(v.prezzoUnitario||v.prezzo)*v.qty,0),0)}
function tCop(t){if(!t) return 0; return(t.coperti||0)*(S.prezzoCoperto||0)}
function tTot(t){if(!t) return 0; return tImporto(t)+tCop(t)}

function cartExt(key){
  const c=cart[key]; if(!c||!c.qty) return 0;
  const prodId=c.prodottoId||key;
  const p=M.find(m=>m.id===prodId); if(!p) return 0;
  const ext=(c.aggiunte||[]).reduce((s,aid)=>{const a=(S.aggiunte||[]).find(x=>x.id===aid);return s+(a?a.prezzo:0)},0);
  return(p.prezzo+ext)*c.qty;
}

// normalizza i dati tavolo da Firebase (array vuoti, null, ecc.)
function normalizzaT(rawT){
  if(!rawT) return {};
  const out={};
  Object.entries(rawT).forEach(([k,t])=>{
    if(!t){out[k]={stato:'libero',cameriere:'',apertoAlle:null,coperti:0,giri:[]};return;}
    out[k]={
      stato:t.stato||'libero',
      cameriere:t.cameriere||'',
      apertoAlle:t.apertoAlle||null,
      coperti:Number(t.coperti)||0,
      giri:Array.isArray(t.giri)?t.giri:
        t.giri&&typeof t.giri==='object'?Object.values(t.giri):[]
    };
    out[k].giri=out[k].giri.map(g=>({
      ...g,
      voci:Array.isArray(g.voci)?g.voci:
        g.voci&&typeof g.voci==='object'?Object.values(g.voci):[]
    }));
  });
  return out;
}

function durataSerata(apertoAlle){
  const [hh,mm]=(apertoAlle||'').split(':').map(Number);
  if(isNaN(hh)||isNaN(mm)) return '';
  const now=new Date();
  const aperto=new Date();
  aperto.setHours(hh,mm,0,0);
  let diff=Math.floor((now-aperto)/60000);
  if(diff<0) diff+=1440;
  if(diff>600) return '';
  if(diff>=60) return Math.floor(diff/60)+'h '+(diff%60)+'m';
  return diff+'m';
}

function renderPosOrderList(){
  if(!selT) return;
  const t=T[selT]||{stato:'libero',coperti:0,giri:[]};
  const voci=(t.giri||[]).flatMap(g=>g.voci||[]).filter(Boolean);
  const cartItems=Object.entries(cart).filter(([,v])=>v.qty>0).map(([key,v])=>{
    const prodId=v.prodottoId||key;
    const p=M.find(m=>m.id===prodId); if(!p) return null;
    const ext=(v.aggiunte||[]).reduce((s,aid)=>{const a=(S.aggiunte||[]).find(x=>x.id===aid);return s+(a?a.prezzo:0)},0);
    const prezzoFin=v.prezzoOverride!=null?v.prezzoOverride:p.prezzo+ext;
    return{vid:'cart-'+key,nome:p.nome,prezzo:prezzoFin,prezzoUnitario:prezzoFin,qty:v.qty,inCart:true,aggiunte:v.aggiunte||[],note:v.note||''};
  }).filter(Boolean);

  const all=[...voci.map(v=>({...v,inCart:false})),...cartItems];

let _cassettoPort=null;

async function apriCassetto(){
  try{
    // prima connessione: chiede di selezionare la porta
    if(!_cassettoPort){
      if(!navigator.serial){
        alert('Web Serial non supportato.\nUsa Edge o Chrome su Windows.');
        return;
      }
      _cassettoPort=await navigator.serial.requestPort();
    }
    if(!_cassettoPort.readable){
      await _cassettoPort.open({baudRate:9600});
    }
    // ESC/POS comando apertura cassetto: ESC p 0 25 250
    const writer=_cassettoPort.writable.getWriter();
    await writer.write(new Uint8Array([0x1B,0x70,0x00,0x19,0xFA]));
    writer.releaseLock();
  }catch(e){
    _cassettoPort=null;
    // fallback: stampa pagina vuota (alcuni driver aprono il cassetto automaticamente)
    console.warn('Serial err:',e);
    stampaDiretto('<div style="visibility:hidden">.</div>');
  }
}

function printComandaCassa(voci, tavKey){
  const {zona,num}=tabellaInfo(tavKey);
  const zonaLabel=zona?zona.nome.replace(/[^\w\s]/g,'').trim():'';
  const tavLabel=(zonaLabel||'Tavolo')+' / T'+num;
  const ora=nowT();
  // raggruppa per reparto
  const reparti=[...new Set(voci.map(v=>v.reparto).filter(Boolean))];
  let stampeLocali=0;
  reparti.forEach((rep)=>{
    const voceRep=voci.filter(v=>v.reparto===rep);
    if(!voceRep.length) return;

    if(rep!=='Bar'){
      const entry={tavolo:tavKey,reparto:rep,cameriere:'Cassa',coperti:(T[tavKey]&&T[tavKey].coperti)||0,items:voceRep.map(v=>({nome:v.nome,qty:v.qty,note:v.note||'',aggiunte:v.aggiunte||[],aspetta:v.aspetta||false})),ts:Date.now()};
      if(window.fbSet){
        // Pizzeria/Cucina → coda Firebase, la instrada la stampante giusta (come dai telefoni)
        const qKey='q'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
        window.fbSet('printQueue/'+qKey,entry);
      } else {
        // Firebase non ancora pronto: NON stampare in locale (finirebbe sulla stampante sbagliata).
        // Metti in coda, verrà inviata appena la connessione è pronta (con avviso se scade il tempo)
        window._pendingPrintQueue=window._pendingPrintQueue||[];
        window._pendingPrintQueue.push(entry);
        mostraAvvisoStampa('⏳ Connessione in corso: comanda '+rep+' in attesa di collegamento…');
        // rete di sicurezza: se dopo 20s non si è ancora collegato, stampa comunque in locale con avviso
        setTimeout(()=>{
          const idx=(window._pendingPrintQueue||[]).indexOf(entry);
          if(idx===-1)return; // già inviata nel frattempo
          window._pendingPrintQueue.splice(idx,1);
          mostraAvvisoStampa('⚠️ '+rep+' NON collegata — stampata qui, consegnala a mano!');
          const htmlFallback=`
            <div style="text-align:center;font-size:22px;font-weight:900;letter-spacing:.05em;border:3px solid #000;padding:6px;margin-bottom:6px">⚠️ ${rep.toUpperCase()} ⚠️<br><span style="font-size:13px">(stampata al bar per errore rete — consegnare a mano)</span></div>
            <div style="font-size:18px;font-weight:900">${tavLabel}</div>
            <div style="font-size:13px;margin-bottom:6px">🕐 ${nowT()}</div>
            <div style="border-top:1px dashed #000;margin:6px 0"></div>
            ${voceRep.map(v=>`<div style="font-size:20px;font-weight:700;margin-bottom:2px">${v.qty}× ${v.nome}</div>`).join('')}`;
          stampaDiretto(htmlFallback);
        },20000);
      }
      return;
    }

    // Bar → stampa in locale sulla stampante della cassa (già quella giusta)
    const i=stampeLocali++;
    setTimeout(()=>{
      const html=`
        <div style="text-align:center;font-size:22px;font-weight:900;letter-spacing:.05em;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:6px">${rep.toUpperCase()}</div>
        <div style="font-size:18px;font-weight:900">${tavLabel}</div>
        <div style="font-size:13px;margin-bottom:6px">🕐 ${ora}</div>
        <div style="border-top:1px dashed #000;margin:6px 0"></div>
        ${voceRep.map(v=>`
          <div style="font-size:20px;font-weight:700;margin-bottom:2px">${v.qty}× ${v.nome}</div>
          ${(v.aggiunte||[]).length?`<div style="font-size:13px;padding-left:12px">${v.aggiunte.map(a=>(a.tipo==='tolto'?'−':'+')+a.nome).join(', ')}</div>`:''}
          ${v.note?`<div style="font-size:13px;font-style:italic;padding-left:12px">↳ ${v.note}</div>`:''}
          ${v.aspetta?`<div style="font-size:14px;font-weight:700">⏳ PRIMA UN ANTIPASTO</div>`:''}
        `).join('<div style="border-top:1px dotted #ccc;margin:4px 0"></div>')}
        <div style="border-top:2px solid #000;margin-top:8px;text-align:center;font-size:11px;padding-top:4px">
          ${new Date().toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'})} ${ora}
        </div>`;
      stampaDiretto(html);
    }, i*1200);
  });
}

function findPosItemByVid(vid){
  if(!selT||!vid)return null;
  const t=T[selT]||{giri:[]};
  if(vid.startsWith('cart-')){
    const key=vid.replace('cart-','');
    const v=cart[key];if(!v)return null;
    const prodId=v.prodottoId||key;
    const p=M.find(m=>m.id===prodId);if(!p)return null;
    const ext=(v.aggiunte||[]).reduce((s,aid)=>{const a=(S.aggiunte||[]).find(x=>x.id===aid);return s+(a?a.prezzo:0)},0);
    return{prezzoUnitario:(v.prezzoOverride!=null?v.prezzoOverride:p.prezzo+ext),reparto:p.reparto};
  }
  for(const g of (t.giri||[])){
    const v=(g.voci||[]).find(x=>x.vid===vid);
    if(v)return v;
  }
  return null;
}

function selPosRow(vid){
  if(posSelectedRow===vid){ plDeselect(); return; }
  posSelectedRow=vid;
  const item=findPosItemByVid(vid);
  prezzoLibero=item?String((item.prezzoUnitario||item.prezzo||0).toFixed(2)).replace('.',','):'';
  renderPosOrderList();
  renderPLPanel();
}

function plDeselect(){
  posSelectedRow=null;
  prezzoLibero='';repartoLibero=null;
  renderPosOrderList();
  renderPLPanel();
}

function plClear(){
  prezzoLibero='';
  renderPLPanel();
}

function plDigit(k){
  if(k===','&&prezzoLibero.includes(','))return;
  if(prezzoLibero==='0'&&k!==',')prezzoLibero='';
  if(prezzoLibero.includes(',')&&prezzoLibero.split(',')[1]?.length>=2)return;
  if(prezzoLibero.length>=7)return;
  prezzoLibero+=k;
  renderPLPanel();
}
function plBack(){
  prezzoLibero=prezzoLibero.slice(0,-1);
  renderPLPanel();
}
function plReparto(r){
  repartoLibero=r;
  renderPLPanel();
}
function plApply(){
  if(!selT)return;
  const prezzo=parseFloat(prezzoLibero.replace(',','.'));
  if(!prezzo||prezzo<=0)return;
  if(posSelectedRow){
    // modifica il prezzo della riga selezionata (già in comanda o nel carrello)
    if(posSelectedRow.startsWith('cart-')){
      const key=posSelectedRow.replace('cart-','');
      if(cart[key])cart[key].prezzoOverride=prezzo;
    } else {
      const t=T[selT];
      (t.giri||[]).forEach(g=>{
        (g.voci||[]).forEach(v=>{ if(v.vid===posSelectedRow){ v.prezzo=prezzo; v.prezzoUnitario=prezzo; } });
      });
      LS.set('t',T);
    }
    posSelectedRow=null;
    prezzoLibero='';repartoLibero=null;
    renderLeft();
    renderPosHeader();
    renderPosOrderList();
    renderPLPanel();
  } else {
    // nuova voce a prezzo libero
    if(!repartoLibero)return;
    const t=T[selT];
    t.stato='occupato';t.apertoAlle=t.apertoAlle||nowT();
    const voce={vid:uid(),prodottoId:null,nome:repartoLibero,prezzo,prezzoUnitario:prezzo,aggiunte:[],reparto:repartoLibero,qty:1,note:'',pronto:false,aspetta:false};
    const giro={gid:uid(),orario:nowT(),ts:Date.now(),voci:[voce],fonte:'cassa'};
    t.giri=[...(t.giri||[]),giro];
    LS.set('t',T);
    _stampatiGids.add(giro.gid);
    prezzoLibero='';repartoLibero=null;
    renderLeft();
    renderPosHeader();
    renderPosOrderList();
    renderPLPanel();
  }
}

function chC(id,d){
  const c=cart[id]||{qty:0,note:'',aggiunte:[]};
  c.qty=Math.max(0,c.qty+d);
  if(c.qty===0)delete cart[id];else cart[id]=c;
  renderRight();
}

function togAgg(pid,aid){
  const c=cart[pid];if(!c)return;
  c.aggiunte=c.aggiunte||[];
  const i=c.aggiunte.indexOf(aid);
  const sel=i===-1;
  if(sel)c.aggiunte.push(aid);else c.aggiunte.splice(i,1);
  // aggiorna solo il chip — nessun re-render
  const list=document.getElementById('aggc-'+pid);
  if(list) list.querySelectorAll('span').forEach(s=>{
    if(s.getAttribute('onclick')?.includes("'"+aid+"'")){
      s.className='chip'+(sel?' on':'');
    }
  });
  // aggiorna solo il footer
  const ci=Object.entries(cart).filter(([,v])=>v.qty>0);
  const ct=ci.reduce((s,[id])=>s+cartExt(id),0);
  const t=T[selT]; const occ=t&&t.stato==='occupato';
  let f='';
  if(ci.length>0) f+=`<button class="btn btn-p" style="margin-bottom:7px" onclick="inviaC()">➕ Invia — ${ci.reduce((s,[,v])=>s+v.qty,0)} pz · ${eur(ct)}</button>`;
  if(occ){f+=`<div class="btn-g" style="margin-bottom:7px"><button class="btn btn-s" onclick="stampaConto('${selT}')">🖨️ Conto</button><button class="btn btn-s" onclick="showSposta('${selT}')">🔀 Sposta</button></div><div class="btn-g" style="margin-bottom:7px"><button class="btn btn-s" onclick="libera('${selT}')">🔓 Libera</button><button class="btn btn-ok" onclick="showPaga('${selT}',${tTot(t)})">💰 Incassa — ${eur(tTot(t))}</button></div>`;}
  document.getElementById('rfooter').innerHTML=f;
}

function inviaC(aspettaAntipasto){
  if(!selT)return;
  const ci=Object.entries(cart).filter(([,v])=>v.qty>0);
  if(!ci.length)return;

  if(aspettaAntipasto===undefined){
    const haPizze  =ci.some(([,v])=>{const prodId=v.prodottoId||'';const p=M.find(m=>m.id===prodId);return p&&p.reparto==='Pizzeria';});
    const haAntipas=ci.some(([,v])=>{const prodId=v.prodottoId||'';const p=M.find(m=>m.id===prodId);return p&&p.reparto==='Cucina'&&p.cat!=='Dolci';});
    if(haPizze&&haAntipas){
      document.getElementById('pay-box').innerHTML=`
        <div class="ovt">Ordine misto</div>
        <div class="ovtx">Ci sono sia antipasti che pizze.<br>Vuoi che il pizzaiolo aspetti?</div>
        <div class="btn-g" style="margin-bottom:10px">
          <button onclick="closePay();inviaC(true)" style="background:#F2B70522;border:2px solid var(--gold);color:var(--gold);border-radius:12px;padding:16px 8px;font-size:13px;cursor:pointer;font-family:var(--fb);font-weight:700;line-height:1.4">🕐 Pizze dopo<br>gli antipasti</button>
          <button onclick="closePay();inviaC(false)" style="background:#5AA65522;border:2px solid var(--grn);color:var(--grn);border-radius:12px;padding:16px 8px;font-size:13px;cursor:pointer;font-family:var(--fb);font-weight:700;line-height:1.4">🍕 Manda tutto<br>subito</button>
        </div>
        <button onclick="closePay()" style="width:100%;background:none;border:1px solid var(--bord);color:var(--mut);border-radius:8px;padding:8px;cursor:pointer;font-family:var(--fb);font-size:12px">Annulla</button>`;
      document.getElementById('pay-ov').style.display='flex';
      return;
    }
    aspettaAntipasto=false;
  }

  const voci=ci.map(([,v])=>{
    const prodId=v.prodottoId||'';
    const p=M.find(m=>m.id===prodId);if(!p)return null;
    const aggSel=(v.aggiunte||[]).map(aid=>{const a=(S.aggiunte||[]).find(x=>x.id===aid);return a?{id:a.id,nome:a.nome,prezzo:a.prezzo,tipo:a.tipo||'aggiunta'}:null}).filter(Boolean);
    const ext=aggSel.reduce((s,a)=>s+a.prezzo,0);
    const aspetta=aspettaAntipasto&&p.reparto==='Pizzeria';
    const prezzoFin=v.prezzoOverride!=null?v.prezzoOverride:p.prezzo+ext;
    return{vid:uid(),prodottoId:prodId,nome:p.nome,prezzo:v.prezzoOverride!=null?v.prezzoOverride:p.prezzo,prezzoUnitario:prezzoFin,aggiunte:aggSel,reparto:p.reparto,qty:v.qty,note:v.note||'',pronto:false,aspetta:aspetta||false};
  }).filter(Boolean);
  const t=T[selT];
  t.stato='occupato';t.apertoAlle=t.apertoAlle||nowT();
  const giro={gid:uid(),orario:nowT(),ts:Date.now(),voci,fonte:'cassa'};
  t.giri=[...(t.giri||[]),giro];
  LS.set('t',T);cart={};
  _stampatiGids.add(giro.gid);
  renderLeft();
  printComandaCassa(voci, selT);
  if(document.getElementById('pos-wrap').classList.contains('active')){
    renderPosOrderList();
    const panel=document.getElementById('pos-right-panel');
    panel.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;">
      <div style="font-size:48px">✅</div>
      <div style="font-family:var(--fd);font-size:22px;color:var(--grn)">Comanda inviata!</div>
    </div>`;
    setTimeout(()=>renderPosCategories(), 1500);
  } else {
    renderRight();
  }
}

    for(let i=1;i<=z.num;i++){
      const k=z.id+'_'+i;

      const t=T[k];
      const occ=t&&t.stato==='occupato';
      html+=`<button onclick="doSposta('${fromKey}','${k}')" style="
        padding:6px 2px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:700;
        border:1px solid ${occ?'var(--acc)':'var(--bord)'};

    }

  });

  document.getElementById('pay-ov').style.display='flex';

function doSposta(fromKey, toKey){
  const tFrom=T[fromKey];
  const tTo=T[toKey]||{stato:'libero',cameriere:'',apertoAlle:null,coperti:0,giri:[]};
  const {nome:nomeFrom}=tabellaInfo(fromKey);
  const {nome:nomeTo}=tabellaInfo(toKey);

  // unisci i dati del tavolo di partenza in quello di destinazione
  tTo.stato='occupato';
  tTo.cameriere=tTo.cameriere||tFrom.cameriere||'';
  tTo.apertoAlle=tTo.apertoAlle||tFrom.apertoAlle||nowT();
  tTo.coperti=(tTo.coperti||0)+(tFrom.coperti||0);
  tTo.giri=[...(tTo.giri||[]),...(tFrom.giri||[]).map(g=>({
    ...g,
    orario:g.orario+' (da '+nomeFrom+')',
  }))];
  T[toKey]=tTo;

  // libera il tavolo di partenza
  T[fromKey]={stato:'libero',cameriere:'',apertoAlle:null,coperti:0,giri:[]};
  LS.set('t',T);
  closePay();
  selT=toKey;
  renderLeft();
  renderRight();
  mostraMsg('rfooter', `✓ Spostato da ${nomeFrom} a ${nomeTo}`, 'var(--grn)');
}

function showPaga(key,tot){
  const {nome}=tabellaInfo(key);
  const t=T[key]||{};
  // se manca il cameriere, prova a leggerlo da Firebase prima di mostrare il dialogo
  if(!t.cameriere && window.fbGet){
    window.fbGet('t').then(fbT=>{
      if(fbT&&fbT[key]&&fbT[key].cameriere){
        T[key].cameriere=fbT[key].cameriere;
        localStorage.setItem('pos-t',JSON.stringify(T));
      }
      _mostraDialogoPaga(key,tot);
    }).catch(()=>_mostraDialogoPaga(key,tot));
  } else {
    _mostraDialogoPaga(key,tot);
  }
}
function _mostraDialogoPaga(key,tot){
  const {nome}=tabellaInfo(key);
  document.getElementById('pay-box').innerHTML=`
    <div class="ovt">${nome} — ${eur(tot)}</div>
    <div class="ovtx">Come paga il cliente?</div>
    <div class="btn-g" style="margin-bottom:10px">
      <button onclick="doPaga('${key}',${tot},'cash',0)" style="background:#F2B70522;border:2px solid var(--gold);color:var(--gold);border-radius:12px;padding:18px 10px;font-size:22px;cursor:pointer;font-family:var(--fd);display:flex;flex-direction:column;align-items:center;gap:4px">💵<span>CASH</span></button>
      <button onclick="showMancia('${key}',${tot})" style="background:#5AA65522;border:2px solid var(--grn);color:var(--grn);border-radius:12px;padding:18px 10px;font-size:22px;cursor:pointer;font-family:var(--fd);display:flex;flex-direction:column;align-items:center;gap:4px">💳<span>POS</span></button>
    </div>
    <button onclick="closePay()" style="width:100%;background:none;border:1px solid var(--bord);color:var(--mut);border-radius:8px;padding:8px;cursor:pointer;font-family:var(--fb);font-size:12px">Annulla</button>`;
  document.getElementById('pay-ov').style.display='flex';
}
function showMancia(key,tot){
  const {nome}=tabellaInfo(key);
  document.getElementById('pay-box').innerHTML=`
    <div class="ovt">POS — ${nome}</div>
    <div class="ovtx">Mancia lasciata sul POS? (€)</div>
    <input type="number" id="mi" step="0.5" min="0" placeholder="0,00" class="fi" style="font-size:16px;padding:10px;margin-bottom:14px">
    <div class="btn-g">
      <button onclick="showPaga('${key}',${tot})" class="btn btn-s">← Indietro</button>
      <button onclick="doPaga('${key}',${tot},'pos',parseFloat(document.getElementById('mi').value)||0)" class="btn btn-ok">✓ Chiudi</button>
    </div>`;
}
function doPaga(key,tot,pag,mancia){
  const t=T[key]; if(!t) return;
  const {nome}=tabellaInfo(key);

  // salva e libera il tavolo — ricevuta_stampata inizia false
  const entry={numero:nome,totale:tot,mancia:mancia||0,pagamento:pag,coperti:t.coperti||0,cameriere:t.cameriere||'',chiuso:new Date().toISOString(),data:todayS(),giri:t.giri};
  STO.push(entry);
  if(STO.length>5000)STO=STO.slice(-5000);
  // prepara la ricevuta PRIMA di liberare (ha bisogno dei dati del tavolo)
  preparaRicevuta(key, pag, mancia||0);
  T[key]={stato:'libero',cameriere:'',apertoAlle:null,coperti:0,giri:[]};
  LS.set('t',T);LS.set('sto',STO);
  selT=null;cart={};
  document.getElementById('pos-wrap').classList.remove('active');
  document.getElementById('map-wrap').classList.remove('hidden');
  renderLeft();
  document.getElementById('pay-ov').style.display='none';
  stampaDiretto(window._lastRicevuta||'', ()=>mostraAvvisoStampa());
}
function closePay(){document.getElementById('pay-ov').style.display='none';}

function ristampaUltima(){
  const html=window._lastRicevuta||localStorage.getItem('pos-last-ricevuta');
  if(!html){alert('Nessuna ricevuta da ristampare');return;}
  stampaDiretto(html);
}

function nextNumOp(){
  const k='pos-num-op';
  const n=(parseInt(localStorage.getItem(k)||'0')||0)+1;
  localStorage.setItem(k,n);
  return 'T-'+String(n).padStart(5,'0');
}

function pulisciAspVuoti(){
  ASP=LS.get('asp',[]);
  const oggi=todayS();
  // rimuovi: ordini vuoti + ordini aperti di giorni precedenti
  ASP=ASP.filter(o=>o.stato!=='aperto'||(o.data===oggi&&(o.voci||[]).length>0));
  LS.set('asp',ASP);
  renderAspLeft();
}

function nuovoAsp(){
  try{
    ASP=LS.get('asp',[]);
    // rimuovi ordini vuoti precedenti
    ASP=ASP.filter(o=>o.stato!=='aperto'||(o.voci||[]).length>0);
    const n=ASP.filter(o=>o.data===todayS()).length+1;
    const ord={id:uid(),numero:n,data:todayS(),cliente:'',telefono:'',stato:'aperto',voci:[],creatoAlle:nowT(),ts:Date.now()};
    ASP.push(ord);LS.set('asp',ASP);
    aspSel=ord.id;aspCart={};aspRightCat=null;aspRightGrp=null;
    renderAspLeft();
    renderAspRight();
  }catch(e){
    document.getElementById('asp-left-col').innerHTML=`<div style="color:var(--red);padding:12px">Errore: ${e.message}</div>`;
    console.error('nuovoAsp:',e);
  }
}

function selAsp(id){
  aspSel=id;aspCart={};aspRightCat=null;aspRightGrp=null;

function aspItemByVid(vid){
  if(!aspSel)return null;
  const ord=ASP.find(o=>o.id===aspSel);if(!ord)return null;
  if(vid.startsWith('cart-')){
    const key=vid.replace('cart-','');
    const v=aspCart[key];if(!v)return null;
    const p=M.find(m=>m.id===key);if(!p)return null;
    const ext=(v.aggiunte||[]).reduce((s,aid)=>{const a=(S.aggiunte||[]).find(x=>x.id===aid);return s+(a?a.prezzo:0)},0);
    return{nome:p.nome,qty:v.qty,prezzoUnitario:p.prezzo+ext,inCart:true,aggiunte:v.aggiunte||[],note:v.note||'',vid};
  }
  const ord2=ASP.find(o=>o.id===aspSel);
  const v=(ord2?.voci||[]).find(x=>x.vid===vid);
  return v?{...v,inCart:false,vid}:null;
}

function renderAspLeft(){
  const col=document.getElementById('asp-left-col');
  if(!col)return;
  // NESSUN ORDINE SELEZIONATO → lista ordini aperti
  if(!aspSel){
    const aperti=ASP.filter(o=>o.stato==='aperto').sort((a,b)=>b.ts-a.ts);

    } else {
      aperti.forEach(o=>{
        const tot=(o.voci||[]).reduce((s,v)=>s+(v.prezzoUnitario||v.prezzo)*v.qty,0);

              ${o.ritiro?`<span style="background:var(--acc);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px">⏱ ${o.ritiro}</span>`:''}
            </div>
            <div style="font-size:10px;color:var(--mut);margin-top:2px">${o.data} · creato alle ${o.creatoAlle} · ${(o.voci||[]).length} voci</div>
          </div>
          <div style="font-size:15px;font-weight:700;color:var(--gold);flex-shrink:0">${tot>0?eur(tot):'—'}</div>
        </div>`;
      });
    }
    h+='</div>';
    col.innerHTML=h;
    return;
  }
  // ORDINE SELEZIONATO → dati cliente + elenco chiaro voci (inviate + carrello)
  const ord=ASP.find(o=>o.id===aspSel);
  if(!ord){aspSel=null;renderAspLeft();return;}
  const voci=(ord.voci||[]).map(v=>({...v,inCart:false,vid:v.vid}));
  const cartItems=Object.entries(aspCart).filter(([,v])=>v.qty>0).map(([id,v])=>{
    const p=M.find(m=>m.id===id);if(!p)return null;
    const ext=(v.aggiunte||[]).reduce((s,aid)=>{const a=(S.aggiunte||[]).find(x=>x.id===aid);return s+(a?a.prezzo:0)},0);
    return{vid:'cart-'+id,nome:p.nome,prezzoUnitario:p.prezzo+ext,qty:v.qty,inCart:true,aggiunte:v.aggiunte||[],note:v.note||''};
  }).filter(Boolean);
  const all=[...voci,...cartItems];
  const totInviato=voci.reduce((s,v)=>s+(v.prezzoUnitario||v.prezzo)*v.qty,0);
  const totCart=cartItems.reduce((s,v)=>s+v.prezzoUnitario*v.qty,0);
  const totale=totInviato+totCart;

  let h=`<div style="padding:10px 10px 0">
    <button class="tb-btn" onclick="aspSel=null;renderAspLeft();renderAspRight();" style="margin-bottom:8px;font-size:11px">← Lista ordini</button>
    <div style="display:flex;gap:7px;margin-bottom:10px">
      <div style="flex:1"><label style="font-size:10px;color:var(--mut);display:block;margin-bottom:3px">Nome cliente</label><input class="fi" value="${ord.cliente||''}" oninput="aspCliente('cliente',this.value)" placeholder="Cliente…"></div>
      <div style="flex:1"><label style="font-size:10px;color:var(--mut);display:block;margin-bottom:3px">⏱ Ritiro ore</label><input class="fi" value="${ord.ritiro||''}" oninput="aspCliente('ritiro',this.value)" placeholder="es. 21:30"></div>
    </div>
  </div>
  <div class="pos-thead">
    <span class="pqty">Ud</span>
    <span class="pname">Producto</span>
    <span class="pprc">Precio</span>
    <span class="ptot">Total</span>
  </div>
  <div class="pos-order" style="flex:1">`;
  if(!all.length){
    h+='<div style="color:var(--mut);text-align:center;padding:30px;font-size:13px;">Nessuna voce selezionata.<br>Scegli i prodotti dalle categorie a destra →</div>';
  } else {
    all.forEach(v=>{
      const imp=(v.prezzoUnitario||v.prezzo)*v.qty;
      const agg=(v.aggiunte||[]).map(a=>{if(typeof a==='string'){const x=(S.aggiunte||[]).find(s=>s.id===a);return x?x.nome:a;}return a.nome||a;}).filter(Boolean).join(', ');
      h+=`<div class="pos-row">
        <span class="pqty" style="${v.inCart?'color:var(--grn)':''}">${v.qty}</span>
        <span class="pname" ${v.inCart?`onclick="showAspAggiunte('${v.vid.replace('cart-','')}')" style="cursor:pointer"`:''}>
          <div>${v.nome}${agg?` <span style="font-size:10px;color:var(--grn)">+${agg}</span>`:''}</div>
          ${v.note?`<div style="font-size:10px;color:var(--mut)">${v.note}</div>`:''}
        </span>
        <span class="pprc">${(v.prezzoUnitario||v.prezzo).toFixed(2)}</span>
        <span class="ptot">${imp.toFixed(2)}</span>
        ${v.inCart?`<button onclick="showAspAggiunte('${v.vid.replace('cart-','')}')" style="background:none;border:none;color:var(--gold);font-size:15px;cursor:pointer;padding:2px 5px;flex-shrink:0;" title="Aggiunte/Note">✏️</button>`:''}
        <button onclick="cancellaAspRow('${v.vid}')" style="padding:2px 6px;border-radius:6px;flex-shrink:0;font-weight:700;opacity:.7;" title="Rimuovi">✕</button>
      </div>`;
    });
  }
  h+=`</div>
  <div class="pos-total-bar">
    <div style="font-size:11px;color:var(--mut);margin-bottom:2px">Totale</div>
    <div class="pos-total-num">${eur(totale)}</div>
  </div>`;
  if(cartItems.length>0){
    const nPz=cartItems.reduce((s,v)=>s+v.qty,0);
    h+=`<div style="padding:8px 10px 0"><button class="btn btn-p" style="width:100%" onclick="inviaAspCucina('${ord.id}')">📨 Invia comanda ai reparti — ${nPz} pz</button></div>`;
  }
  h+=`<div style="padding:8px 10px 0">
    <button class="btn btn-ok" style="width:100%;font-size:16px;padding:14px" onclick="showPagaAsp('${ord.id}',${totale})">💰 Incassa — ${eur(totale)}</button>
  </div>
  <div class="pos-acts" style="grid-template-columns:repeat(2,1fr)">
    <button class="pact" onclick="liberaAsp('${ord.id}')">🗑️<span>Elimina ordine</span></button>
    <button class="pact" onclick="stampaAsp('${ord.id}')">🖨️<span>Stampa</span></button>
  </div>`;
  col.innerHTML=h;
}

    <input id="asp-agg-search" oninput="filtraAspAgg(this.value)" placeholder="🔍 Cerca ingrediente..."

function togAspAggChip(prodId,aggId){
  const c=aspCart[prodId];if(!c)return;
  c.aggiunte=c.aggiunte||[];

  const sel=i===-1;
  if(sel)c.aggiunte.push(aggId);else c.aggiunte.splice(i,1);
  const chip=document.getElementById('aac-'+aggId);
  if(chip){
    chip.style.borderColor=sel?'var(--grn)':'var(--bord)';
    chip.style.background=sel?'#5AA65522':'var(--surf)';
    chip.style.color=sel?'var(--grn)':'var(--txt)';
  }
}
function filtraAspAgg(q){
  const chips=document.getElementById('asp-agg-chips');
  if(!chips)return;
  const s=q.toLowerCase().trim();
  chips.querySelectorAll('span').forEach(c=>{
    c.style.display=(!s||c.textContent.toLowerCase().includes(s))?'':'none';
  });
}

function aspCliente(k,v){const o=ASP.find(x=>x.id===aspSel);if(o){o[k]=v;LS.set('asp',ASP);}}
function chAC(id,d){
  const c=aspCart[id]||{qty:0,note:'',aggiunte:[]};
  c.qty=Math.max(0,c.qty+d);
  if(c.qty===0)delete aspCart[id];else aspCart[id]=c;
  renderAspLeft();
  if(aspRightCat)renderAspItemsArea();
}
function inviaAspCucina(id){
  const ord=ASP.find(o=>o.id===id);
  if(!ord)return;
  if(!ord.voci)ord.voci=[];
  // 1) sposta le voci dal carrello provvisorio nell'ordine (come i tavoli: selezione → invio, un solo passaggio)
  Object.entries(aspCart).filter(([,v])=>v.qty>0).forEach(([pid,v])=>{
    const p=M.find(m=>m.id===pid);if(!p)return;
    const aggSel=(v.aggiunte||[]).map(aid=>{const a=(S.aggiunte||[]).find(x=>x.id===aid);return a?{id:a.id,nome:a.nome,prezzo:a.prezzo,tipo:a.tipo||'aggiunta'}:null}).filter(Boolean);
    const ext=aggSel.reduce((s,a)=>s+a.prezzo,0);
    ord.voci.push({vid:uid(),prodottoId:pid,nome:p.nome,prezzo:p.prezzo,prezzoUnitario:p.prezzo+ext,aggiunte:aggSel,reparto:p.reparto,qty:v.qty,note:v.note||''});
  });
  aspCart={};
  LS.set('asp',ASP);
  if(!(ord.voci||[]).length){
    mostraMsg('asp-left-col','Seleziona almeno un prodotto prima di inviare.','var(--mut)');
    renderAspLeft();
    return;
  }
  const nuove=(ord.voci||[]).filter(v=>!v.inviato);
  if(!nuove.length){
    mostraMsg('asp-left-col','Tutte le voci sono già state inviate in cucina.','var(--mut)');
    renderAspLeft();
    return;
  }
  // 2) scrivi una voce virtuale nei tavoli con chiave 'A'+numero
  // la pizzeria/cucina la vede come qualsiasi altro tavolo
  T=LS.get('t',T);
  const tKey='A'+ord.numero;
  if(!T[tKey]) T[tKey]={stato:'occupato',cameriere:'Asporto #'+ord.numero,apertoAlle:nowT(),coperti:0,giri:[]};
  T[tKey].giri.push({
    gid:uid(),
    orario:nowT()+' — Asporto #'+ord.numero+(ord.cliente?' ('+ord.cliente+')':''),
    ts:Date.now(),
    voci:nuove.map(v=>({...v,pronto:false}))
  });
  ord.voci.forEach(v=>v.inviato=true);
  LS.set('t',T);
  LS.set('asp',ASP);
  // stampa comanda instradata per reparto (Pizzeria/Cucina in coda Firebase, Bar in locale)
  printComandaCassa(nuove,tKey);
  mostraMsg('asp-left-col','✓ Comanda inviata in cucina/pizzeria','var(--grn)');
  renderAspLeft();
  if(aspRightCat)renderAspItemsArea();
}

function aggAspVoci(){
  const ord=ASP.find(o=>o.id===aspSel);if(!ord)return;
  if(!ord.voci) ord.voci=[];
  Object.entries(aspCart).filter(([,v])=>v.qty>0).forEach(([id,v])=>{
    const p=M.find(m=>m.id===id);if(!p)return;
    const aggSel=(v.aggiunte||[]).map(aid=>{const a=(S.aggiunte||[]).find(x=>x.id===aid);return a?{id:a.id,nome:a.nome,prezzo:a.prezzo,tipo:a.tipo||'aggiunta'}:null}).filter(Boolean);
    const ext=aggSel.reduce((s,a)=>s+a.prezzo,0);
    ord.voci.push({vid:uid(),prodottoId:id,nome:p.nome,prezzo:p.prezzo,prezzoUnitario:p.prezzo+ext,aggiunte:aggSel,reparto:p.reparto,qty:v.qty,note:v.note||''});
  });
  LS.set('asp',ASP);aspCart={};
  renderAspLeft();
  if(aspRightCat)renderAspItemsArea();
}
function liberaAsp(id){
  ASP=ASP.filter(o=>o.id!==id);
  LS.set('asp',ASP);
  aspSel=null;aspRightCat=null;aspRightGrp=null;
  renderAspLeft();
  renderAspRight();
}

function showPagaAsp(id,tot){
  // se ci sono ancora voci selezionate ma non inviate ai reparti, mandale ora automaticamente
  const haCarrelloPendente=Object.values(aspCart).some(v=>v.qty>0);
  if(haCarrelloPendente){
    inviaAspCucina(id);
    const ord=ASP.find(o=>o.id===id);
    tot=(ord?.voci||[]).reduce((s,v)=>s+(v.prezzoUnitario||v.prezzo)*v.qty,0);
  }
  document.getElementById('pay-box').innerHTML=`
    <div class="ovt">Asporto — ${eur(tot)}</div>
    <div class="ovtx">Come paga il cliente?</div>

// ── STAMPA VIA IFRAME (funziona anche da Firebase, no popup blocker) ──
function stampaDiretto(html, onError){
  try{
    const iframe=document.createElement('iframe');
    iframe.style.cssText='position:fixed;left:-9999px;top:0;width:80mm;height:600px;border:none;';
    document.body.appendChild(iframe);
    const doc=iframe.contentDocument||iframe.contentWindow.document;
    doc.open();
    doc.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
      <style>
        *{box-sizing:border-box;margin:0;padding:0;color:#000!important;}
        body{font-family:'Courier New',monospace;font-size:15px;padding:3mm;width:76mm;line-height:1.8;}
        @media print{@page{size:80mm auto;margin:1mm;}}
        div{margin-bottom:2px;}
      </style>
    </head><body>${html}</body></html>`);
    doc.close();
    setTimeout(()=>{
      try{iframe.contentWindow.print();}catch(e){console.warn('print err:',e); if(onError) onError(e);}
      setTimeout(()=>{if(iframe.parentElement)iframe.remove();},2000);
    },400);
  }catch(e){
    console.warn('stampaDiretto err:',e);
    if(onError) onError(e);
  }
}

let _fondoCents=0;
function fondoKey(k){
  if(k==='C'){_fondoCents=Math.floor(_fondoCents/10);}
  else if(k==='00'){_fondoCents=Math.min(_fondoCents*100,9999999);}
  else{_fondoCents=Math.min(_fondoCents*10+parseInt(k),9999999);}
  const disp=document.getElementById('fondo-display');
  const inp=document.getElementById('fondo-iniziale');
  if(disp) disp.textContent=(_fondoCents/100).toFixed(2).replace('.',',')+' €';
  if(inp) inp.value=(_fondoCents/100).toString();
}

function addCam(){
  const n=(document.getElementById('nc-n').value||'').trim();
  const p=(document.getElementById('nc-p').value||'').trim();
  if(!n||!p||p.length!==4){const m=document.getElementById('cam-msg');if(m)m.textContent='Nome e PIN 4 cifre obbligatori';return;}
  if(!S.camerieri) S.camerieri=[];
  S.camerieri.push({nome:n,pin:p});
  LS.set('s',S);
  if(window.fbSet) window.fbSet('camerieri',S.camerieri);
  renderImp();
}
function salvaCam(i){
  const n=(document.getElementById('cn-'+i)?.value||'').trim();
  const p=(document.getElementById('cp-'+i)?.value||'').trim();
  if(!n||!p) return;
  S.camerieri[i]={nome:n,pin:p};
  LS.set('s',S);
  if(window.fbSet) window.fbSet('camerieri',S.camerieri);
  renderImp();
}
function delCam(i){
  S.camerieri.splice(i,1);
  LS.set('s',S);
  if(window.fbSet) window.fbSet('camerieri',S.camerieri);
  renderImp();
}

};

// Carica Firebase e sincronizza
(async()=>{
  try{
    const {initializeApp}=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    const {getDatabase,ref,onValue,set,update,get}=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js');
    const fbApp=initializeApp(firebaseConfig);
    const db=getDatabase(fbApp);

    // Funzione per salvare su Firebase
    window.fbSet=async(key,val)=>{
      try{
        if(key==='t'){
          // MERGE (update) invece di sovrascrittura totale: non cancella i tavoli
          // aperti da altri dispositivi (telefoni camerieri) che la cassa non conosce ancora
          await update(ref(db,'pos/t'),val);
        } else {
          await set(ref(db,'pos/'+key),val);
        }
      }catch(e){console.warn('fbSet err:',e);}
    };

    // Sovrascrive LS.set per salvare anche su Firebase
    const origSet=LS.set.bind(LS);
    LS.set=(k,v)=>{
      origSet(k,v);
      const fbKey=(k==='m')?'menu':k; // il menu condivide lo stesso percorso usato da pos-teperino
      window.fbSet(fbKey,v);
    };

    // Riceve il menu quando viene modificato da pos-teperino (o da un altro dispositivo)
    let _menuInit=false;
    onValue(ref(db,'pos/menu'),(snap)=>{
      if(!snap.exists())return;
      if(!_menuInit){ _menuInit=true; return; } // ignora il primo evento (è il nostro stesso menu iniziale)
      const nuovoMenu=snap.val();
      if(!Array.isArray(nuovoMenu)||!nuovoMenu.length)return;
      M=nuovoMenu;
      localStorage.setItem('pos-m',JSON.stringify(M));
      // aggiorna la vista prodotti se è aperta in questo momento
      if(typeof renderPosItemsArea==='function') renderPosItemsArea();
      if(typeof renderAspItemsArea==='function') renderAspItemsArea();
    });

    // Svuota eventuali comande rimaste in attesa (Firebase non ancora pronto quando sono state inviate)
    if(window._pendingPrintQueue&&window._pendingPrintQueue.length){
      const pending=window._pendingPrintQueue.splice(0);
      pending.forEach(entry=>{
        const qKey='q'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
        window.fbSet('printQueue/'+qKey,entry);
      });
      const el=document.getElementById('avviso-stampa');
      if(el)el.remove();
      mostraAvvisoStampa('✅ Collegato — '+pending.length+' comand'+(pending.length>1?'e':'a')+' inviate ora alla stampante giusta');
    }

    // Ascolta i cambiamenti in tempo reale
    // Per 't': merge solo nuovi giri da teperino, non sovrascrivere
    onValue(ref(db,'pos/t'),(snap)=>{
      if(!snap.exists()) return;
      const fbT=normalizzaT(snap.val());
      Object.entries(fbT).forEach(([tavKey,fbTav])=>{
        (fbTav.giri||[]).forEach(g=>{
          if(g.gid && !_stampatiGids.has(g.gid) && g.ts > cassaStartTime){
            _stampatiGids.add(g.gid);
            if(g.fonte!=='cassa'){
              // nuovo ordine dal telefono → aggiunge a T locale e stampa
              if(!T[tavKey]) T[tavKey]={stato:'occupato',cameriere:fbTav.cameriere||'',apertoAlle:fbTav.apertoAlle,coperti:fbTav.coperti||0,giri:[]};
              if(fbTav.cameriere) T[tavKey].cameriere=fbTav.cameriere; // sempre aggiorna
              const giaPresente=T[tavKey].giri.some(eg=>eg.gid===g.gid);
              if(!giaPresente){
                T[tavKey].giri.push(g);
                T[tavKey].stato='occupato';
                localStorage.setItem('pos-t',JSON.stringify(T));
                renderLeft();
                if(selT) renderRight();
              }
            }
          }
        });
      });
    });

    // Ascolta aggiornamenti coperti da pos-teperino
    onValue(ref(db,'pos/t'),(snap)=>{
      if(!snap.exists()) return;
      const fbT=normalizzaT(snap.val());
      let changed=false;
      Object.entries(fbT).forEach(([tavKey,fbTav])=>{
        // aggiorna coperti se diversi
        if(T[tavKey]&&fbTav.coperti&&T[tavKey].coperti!==fbTav.coperti){
          T[tavKey].coperti=fbTav.coperti;
          changed=true;
        }
        // processa nuovi giri da teperino
        (fbTav.giri||[]).forEach(g=>{
          if(g.gid&&!_stampatiGids.has(g.gid)&&g.ts>cassaStartTime){
            _stampatiGids.add(g.gid);
            if(g.fonte!=='cassa'){
              if(!T[tavKey]) T[tavKey]={stato:'occupato',cameriere:fbTav.cameriere||'',apertoAlle:fbTav.apertoAlle,coperti:fbTav.coperti||0,giri:[]};
              if(fbTav.cameriere) T[tavKey].cameriere=fbTav.cameriere; // sempre aggiorna
              const giaPresente=T[tavKey].giri.some(eg=>eg.gid===g.gid);
              if(!giaPresente){
                T[tavKey].giri.push(g);
                T[tavKey].stato='occupato';
                changed=true;
              }
            }
          }
        });
      });
      if(changed){
        localStorage.setItem('pos-t',JSON.stringify(T));
        renderLeft();
        if(selT) renderRight();
      }
    });

    // richieste conto
    onValue(ref(db,'pos/richieste-conto'),(snap)=>{
      if(!snap.exists()) return;
      const val=snap.val();
      localStorage.setItem('pos-richieste-conto', JSON.stringify(val));
      const richieste=Array.isArray(val)?val:Object.values(val||{});
      richieste.forEach(r=>{
        if(r&&r.key&&!document.getElementById('notif-'+r.key)) mostraNotiConto(r);
      });
    });

    console.log('✅ Firebase connesso');

  }catch(e){
    console.warn('Firebase non disponibile, uso localStorage:', e);
  }
})();
</script>
</body>
</html>
